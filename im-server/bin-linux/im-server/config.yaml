# ============================================================
# 阶段四十三：AI 问答配置（服务端归口：API 地址与密钥仅存本文件，客户端不接触密钥）
# providers 为 OpenAI 兼容 chat/completions 接口（可接 DeepSeek/Kimi/智谱/通义/OpenAI 等）
# agents 为面向用户的智能体，通过 provider 名称绑定模型服务；未配置时内置"AI助手"（本地 Mock 应答）
# 阶段四十九起：本节仅作首次启动的种子数据（自动迁入数据库），此后以后台管理界面增删改为准（热生效无需重启）
# ============================================================
# ============================================================
# AI 问答配置（服务端归口：密钥仅存本文件；阶段四十九起本节仅作种子数据，运行时以数据库为准）
# ============================================================
ai:
  # 多轮对话携带的历史消息条数（按 用户+智能体 隔离取最近 N 条）
  # 阶段八十五：上下文按"稳定前缀在前、逐问易变内容在后"组装（系统提示→摘要→历史→知识库/记忆→提问），
  # 可命中 DeepSeek/GLM/Kimi/硅基流动等服务的隐式前缀缓存（命中部分约 1/10 计费），长会话 prompt 消耗显著降低
  context_window: 20
  # 限流：单用户在 limit_window 秒内最多提问 limit_count 次
  limit_count: 10
  limit_window: 60
  # 阶段四十五：文档问答单文档提取文本上限（字符），超出截断后再送模型
  doc_max_chars: 60000

  # 阶段八十四：TRAE 同款历史对话压缩——历史上下文超阈值时把较旧部分 LLM 摘要成一条摘要消息
  # 注入（最近 N 条保留原文），长会话/长任务显著降低 token 消耗并加速模型首字响应；
  # AI 问答同时回溯窗口外更早历史进摘要（不再滑走即丢）
  # 阶段一百三十九：口径拆分——Agent 任务改 KB 判据（见 compress_threshold_kb），
  # compress_threshold_tokens 仅对 AI 问答生效
  compress_threshold_tokens: 12000     # AI 问答触发阈值（估算 token；负数=禁用 AI 问答压缩）
  compress_keep_messages: 6            # 压缩时保留最近原文条数（摘要覆盖更早历史）
  # 阶段一百三十九：Agent 任务上下文压缩阈值（KB 口径，与 TRAE CN 状态栏同款，UTF-8 字节计）——
  # 任务循环上下文累计达到该值时把较早完整工具轮 LLM 摘要归并（最近 N 轮保留原文）；
  # 200KB 中文约 6.8 万 token，请结合所用模型上下文窗口调整；负数=禁用 Agent 任务压缩
  compress_threshold_kb: 200

  # 阶段五十一：知识库向量化 embedding 服务（OpenAI 兼容 /embeddings 接口归口）
  # DeepSeek 不提供 embedding API，可接任意兼容服务（硅基流动 bge-m3 / 智谱 embedding-3 / 本地 ollama 等）
  # api_url 为空时知识库功能静默降级（可建库但文件不向量化），不影响聊天与 AI 问答
  embedding:
    api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/embeddings"                          # OpenAI 兼容 /embeddings 完整地址（示例：https://api.siliconflow.cn/v1/embeddings）；留空=知识库向量化降级关闭；本地 ollama 填 http://127.0.0.1:11434/v1/embeddings（注意是 embeddings 不是 chat/completions）
    api_key: "sk-ws-H.PHLLPDY.idiZ.MEUCIA9DmFD_P_I9Ut3I_q8id1gFY9FvqQvVQLK5NJd6eeVTAiEAjirtmZtzWHDbBqqOpN3p3LlC8dIvofJrFVDbuSt56OY"                          # API 密钥（仅存服务端，不下发客户端）
    model: "qwen3.7-text-embedding"                 # 向量模型名（需与 api_url 服务支持的模型一致）免费限流调试可用BAAI/bge-m3模型或本地nomic-embed-text模型
    batch_size: 16                       # 单次请求批量条数
  # 阶段五十一：知识库参数（data_dir 相对路径基于 exe 所在目录解析）
  kb:
    chunk_size: 500                      # 切片字符数（按段落聚合，超长段落硬切）
    chunk_overlap: 50                    # 相邻切片重叠字符数
    top_k: 3                             # AI 对话单次注入的最大命中条数
    max_context: 4000                    # 注入参考资料总长上限（字符）
    # score_threshold: 0.25              # 旧值保留：实测 nomic-embed-text 中文无关文本基线相似度≈0.59，此值形同虚设
    # score_threshold: 0.62              # 旧值保留：实测部分无关问题（语义词重叠）最高相似度可达 0.67，仍会注入
    score_threshold: 0.68                # 阶段五十三：按检索调试实测校准（无关问题最高 0.67 被过滤，相关问题首条 0.83 有余量；0=不过滤；可用管理后台「检索调试」继续校准）
    data_dir: "kb_data"                  # 知识文件与向量库根目录

  # 阶段五十八：智能体长期记忆（按 用户+智能体 隔离；回复后异步提取，提问时向量召回注入 system 上下文）
  # enabled=false 或 embedding 未配置时全链路静默降级，不影响聊天主链路
  memory:
    enabled: true                        # 总开关（关闭后不提取不注入，管理接口仍可查看/删除已存记忆）
    top_k: 5                             # 每次提问注入的召回记忆条数
    max_per_agent: 200                   # 每 用户+智能体 记忆条数上限（超出淘汰最旧）
    dedup_threshold: 0.88                # 去重相似度阈值（实测 12 对样本：同义改写 0.74~0.98、不同记忆 0.59~0.86 区间交叠，取 0.88 零误杀优先；0.74 级轻微改写会漏存为冗余条目，可在记忆弹窗手动删；原 0.85 会误杀、0.68 误杀更多）
    extract_provider: ""                 # 提取用模型服务名（留空=用智能体当前绑定模型；建议填本地 ollama 零成本）

  # 阶段五十九：智能 Agent 自动化任务（工具调用闭环 + 权限审批，事件流实时推送发起用户）
  # enabled=false 时 AGENT_RUN 返回明确提示，功能整体关闭
  # 阶段八十一/八十二：下列参数均可在 管理后台→Agent 设置 热更新（保存即生效+落库重启不丢），
  # 本文件仅作首次启动的初始默认（后台调整属最新意图，DB 值优先）；workspace_root 不开放后台修改
  agent:
    enabled: true                        # 总开关
    max_steps: 30                        # 单任务最大迭代步数（防模型死循环）
    tool_timeout_seconds: 60             # run_command 默认超时秒（上限 300）
    approve_timeout_seconds: 300         # 高危工具审批等待超时秒（超时任务自动失败）
    auto_write: false                    # write_file 是否免审批（全局开关，默认 false 走审批；内网信任环境可开）
    auto_commands:                       # run_command 命令前缀白名单（全局：命中自动放行，其余强制审批）
                                         # 阶段八十三：审批弹窗"同意并加白"为用户个人白名单（按用户隔离，仅本人生效），与本全局名单并行
      - "dir"
      - "type"
      - "ls"
      - "cat"
      - "echo"
      - "go version"
      - "git status"
      - "git log"
      - "git diff"
      - "node"
      - "python"
    workspace_root: ""                   # 工作区根目录（空=exe目录/agent_workspace，按 username 隔离子目录）
    # 阶段八十四：工具结果入模型上下文的字符上限（read_file/grep/http_request 等工具的超长输出
    # 保留头 2/3 + 尾 1/3 后再进历史，前端执行控制台与留痕仍显示全量）。0=默认 8000，负数=不截断
    tool_result_max_chars: 8000
    # 阶段六十：本地执行器——true 时用户 PC 客户端（Electron）在线，文件/命令工具自动下放到其电脑本地执行，
    # 文件直接落在用户磁盘（%APPDATA%/即时通讯/agent_workspace/<用户名>/）；
    # PC 离线或本地执行超时自动回退服务端工作区执行，任务不中断。false 时全部在服务端执行（阶段五十九行为）
    pc_executor: true
    # 阶段九十一：内置浏览器工具开关（默认开启，nil 视为 true）——TRAE CN 同款内置浏览区，
    # browser_* 工具族（navigate/snapshot/click/input/screenshot/eval/tabs/close）经用户 PC 客户端
    # 的内置浏览器（WebContentsView，与主应用会话隔离）在本地真实执行，可操作 JS 渲染页面与登录态；
    # 点击/输入/执行脚本需用户审批，打开/快照/截图自动放行；false 时不注入不执行（http_request 等不受影响）。
    # 注意：依赖 PC 客户端在线（pc_executor 亦为 true 时才下发）
    pc_browser: true
    # 阶段六十七：任务队列——每用户同时运行任务数上限（concurrency，0=1）与排队上限（queue_size，0=5）；
    # 超出并发数的新任务自动排队（FIFO，任务完成/取消后自动派发队首），排队已满时新任务直接拒绝
    concurrency: 1
    queue_size: 5
    # 阶段六十八：http_request 工具——服务端代理 HTTP 请求（调接口/查数据/抓取网页），
    # GET/HEAD 只读自动放行，POST/PUT/DELETE/PATCH 需用户审批；默认开启，false 时模型工具列表不注入
    http_enabled: true
    # 是否允许 http_request 访问内网/回环地址（默认 true 适配内网信任部署）；
    # false 时在拨号层拦截私网/回环/链路本地 IP（按 DNS 解析后的真实 IP 拦截，域名绕不过），防模型被诱导探测内网
    http_allow_private: true
    # 阶段六十八：web_search 联网搜索工具（默认关闭，须配置服务商后开启 enabled=true）
    # provider 四选一：
    #   tavily     —— AI 搜索 API（https://tavily.com 注册取 key，需 api_key）
    #   bocha      —— 博查搜索，国内直连（https://open.bochaai.com 注册取 key，需 api_key）
    #   searxng    —— 自建元搜索实例（需 endpoint，实例须开启 JSON 输出 format=json）
    #   duckduckgo —— 免 Key 兜底（国内网络环境通常不可达，建议 tavily/bocha）
    web_search:
      enabled: true                        # 开启联网搜索工具（博查，国内直连）
      provider: "bocha"
      api_key: "sk-4c76a2a5358143ff84c5ad8fb316ccfc"

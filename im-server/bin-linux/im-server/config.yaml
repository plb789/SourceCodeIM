  # 阶段五十七：用户自建智能体（个人智能体仅归属者可见可对话；模型从下面白名单中选，防费用失控）
  user_agent:
    enabled: true                     # 用户自建智能体总开关（false 时用户端整体关闭该功能）
    providers: ["deepseek", "ollama"] # 用户可选模型服务白名单（须与上面 providers 中已启用的 name 匹配）
    max_per_user: 10                  # 每人自建数量上限
    prompt_limit: 2000                # 提示词最大字符数

# ============================================================
# 阶段八十八：MCP（Model Context Protocol）——TRAE CN 同款 MCP 能力，服务端归口
# Go 服务端作为 MCP Host 统一管理连接：stdio 在服务端本机拉起子进程，sse/http 直连远程端点；
# 发现的工具供 AI 问答与智能 Agent 注入调用。服务器配置以 im_mcp_server 表为唯一数据源
# （后台管理界面增删改热生效），下方 servers 仅首次启动表空时作种子导入
# ============================================================
mcp:
  enabled: true                       # 总开关（false 时断开全部连接，工具不参与 AI 对话，后台配置记录保留）
  user_enabled: true                  # 用户自建 MCP 总开关（阶段九十：PC 端"我的 MCP 服务器"入口——
                                      # 用户在自己电脑配置本地 stdio 服务器，工具清单经 msg 67 上报注入
                                      # Agent，调用经 PC 本地执行器执行，命令/凭据仅存用户本机；
                                      # false 时本机工具不注入不执行，其他能力不受影响）
  stdio_whitelist:                    # 用户自建服务器（owner 非空）的 stdio 命令白名单（可执行名比对，
                                      # 兼容 .exe/.cmd/.bat 后缀；空=用户自建 stdio 全部拒绝。
                                      # 管理员公共服务器不受限——管理员本就掌控服务端主机）
    - "npx"
    - "uvx"
    - "node"
    - "python"
    - "python3"
  connect_timeout_seconds: 30         # 建连（初始化握手）与工具发现超时秒
  tool_timeout_seconds: 300            # 单次工具调用超时秒
  # servers:                          # 种子服务器示例（仅首次启动导入；之后以后台管理配置为准）
  # ===== 生产可用实例（均为官方维护、开箱即用；按需取消注释后重启） =====
  #   - name: filesystem               # 文件系统访问（官方 @modelcontextprotocol/server-filesystem）
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-filesystem", "D:/workspace", "E:/docs"]
  #     # 注意：args 末尾的目录列表为允许访问的根目录，务必改成实际业务目录，避免放开整盘
  #   - name: fetch                    # 网页抓取（官方 mcp-server-fetch，把网页转为 Markdown 供模型阅读）
  #     transport: stdio
  #     command: uvx
  #     args: ["mcp-server-fetch"]
  #   - name: memory                   # 长期记忆知识图谱（官方 @modelcontextprotocol/server-memory）
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-memory"]
  #     env: { "MEMORY_FILE_PATH": "./data/memory.json" }
  #   - name: github                   # GitHub 仓库/Issue/PR 操作（官方，需个人访问令牌）
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "@modelcontextprotocol/server-github"]
  #     env: { "GITHUB_PERSONAL_ACCESS_TOKEN": "ghp_xxxxxxxxxxxxxxxxxxxx" }
  #   - name: remote-demo              # 远程 MCP 端点（新版 Streamable HTTP 协议，推荐）
  #     transport: http
  #     url: "https://mcp.example.com/mcp"
  #     headers: { "Authorization": "Bearer xxx" }

# ============================================================
# 阶段四十九：后台管理
# admin_users 为管理员用户名白名单：启动时自动将名单内已注册账号标记为管理员角色（im_user.role=1）
# 管理登录实时比对白名单：未注册账号先用 IM 客户端登录一次自动注册，下次启动自动补标记
# 管理后台入口：浏览器访问 http://<服务地址>:8888/admin.html
# ============================================================
admin_users:
  - admin
  - maxtest88

# ============================================================
# 阶段四十六：OnlyOffice 在线文档编辑（自建 DocumentServer，docx/xlsx/pptx 在线编辑）
# enabled 为 false 时前端点击文件保持原下载行为（未部署可保持关闭，零影响）
# 部署步骤见 /docs/开发文档.md 阶段四十六；修改后需重启服务端生效
# ============================================================
onlyoffice:
  # 是否启用在线编辑
  enabled: false
  # 浏览器加载编辑器 api.js 的完整地址（DocumentServer 对浏览器可见的地址，Windows 版默认端口 80）
  api_url: "http://127.0.0.1:80/web-apps/apps/api/documents/api.js"
  # DocumentServer 回源拉取/保存文档时访问 im-server 的地址（需与 DS 网络互通）
  server_url: "http://127.0.0.1:8888"
  # 与 DocumentServer local.json 中三处 secret 一致的服务端 JWT 密钥
  jwt_secret: "im-onlyoffice-secret"
# 阶段一百四十二：内置 TURN/STUN 中继服务（音视频通话 P2P 打洞失败兜底；默认关闭零开销）
# 使用前提：im-server 部署在公网 IP 服务器上，安全组放行 port(UDP+TCP) 与 min_port~max_port(UDP)
# 客户端接入二期实现（iceServers 填 turn:<public_ip>:<port>，建议经信令下发凭证）
turn:
  enabled: false
  # 中继对外报告的 IP：NAT 后部署必填公网 IP；单公网 IP 直挂可留空（自动取本机非回环 IPv4）
  public_ip: ""
  # STUN/TURN 监听端口（UDP+TCP 双栈，coturn 同款默认 3478）
  port: 3478
  # 凭证域（参与长期凭证 MD5 计算）
  realm: "im-server"
  # 长期凭证账号（RFC 5766，仅允许该账号分配中继）
  username: "imcall"
  password: "im-turn-secret"
  # 媒体中继 UDP 端口段（需放行安全组）
  min_port: 49160
  max_port: 49200
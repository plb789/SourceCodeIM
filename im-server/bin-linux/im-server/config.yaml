# IM 服务端核心配置（与《开发文档》5.2 保持一致）
# 说明：本文件由服务端启动时读取，缺省项自动回退内置默认值

# WebSocket 监听地址
ws_addr: ":8888"
# 心跳超时时间（秒）：超过该时间未收到任何消息判定离线
heartbeat_timeout: 90
# 心跳发送间隔（秒，客户端侧）
heartbeat_interval: 30
# 文件分片大小（字节）
# 原实现：chunk_size: 4096（4KB 分片在大文件场景产生海量 WS 消息与 Redis 操作，20MB 文件需 5120 片）
# 阶段三十一：提升至 64KB（base64 后约 87KB，仍在服务端单条消息 1MB 读取上限内），消息数降 16 倍
chunk_size: 65536
# 最大在线连接数（阶段三十一起在 HandleWS 实际执行校验，原实现该配置从未生效）
# 原实现：max_connections: 1000
max_connections: 10000
# 单连接发送队列缓冲条数（阶段三十一：文件分片与聊天消息共用队列，过小会溢出丢消息）
# 原实现：固定 256
send_queue_size: 1024
# 大文件直传阈值（字节，阶段三十一）：超过该值走 HTTP 直传链路（服务端流式落盘），WebSocket 仅传信令
http_upload_threshold: 1048576
# 单请求直传大小上限（字节）：1MB~20MB 走单请求直传；超过该值走分片直传（阶段三十二）
max_file_size: 20971520
# 分片直传单片大小（字节，阶段三十二）：超大文件按该值分片逐片 HTTP 上传（服务端节流推送接收进度）
upload_chunk_size: 4194304
# 分片直传文件大小上限（字节，阶段三十二）：超过该值前端直接拒绝发送
max_direct_size: 2147483648
# 消息撤回时间窗口（秒）：仅该窗口内自己发送的消息可撤回
recall_window: 120

# 阶段一百三十八：AI 计费模式（热更：修改保存后下一次模型调用即生效，无需重启服务端）
# mode 两种可选：
#   usage   = 按量计费（原模式）：按当次实际消耗折算，1000 tokens = 1 积分（上下文越长单次扣费越多）
#   percall = 按次计费（TRAE CN 同款）：每次模型调用固定扣 percall_cost 积分，与 token 数无关
ai_billing:
  mode: usage
  # 按次计费单次扣费（积分）：仅 mode=percall 时生效
  percall_cost: 0.01


# 阶段一百三十六：PC 前端资源密文下发密钥（AES-256-GCM，64 位 hex = 32 字节）
# 用途：/api/secure-file 密文接口与 PC 端加密快照 web-snapshot.enc 共用同一密钥；
# 密钥仅存本文件与 PC 构建产物（掩码扰乱后嵌入 secure-key.js），明文不下发不下盘
# 留空 = 密文接口停用，PC 端自动回退明文链路（功能不受影响，仅无加密）
# 生成方式（PowerShell）：-join ((1..32) | ForEach-Object { '{0:x2}' -f (Get-Random -Maximum 256) })
secure_file_key: "04295b6cbee2a305b95ed81c52bf47637939dcdd40e4525dc644286a2b107402"


# ============================================================

# im-gateway 游戏端口透传·远程加密网关 配置文件

# （独立部署在远程服务器，与 im-gateway 可执行文件同目录运行：./im-gateway [gateway.yaml]

#   协议与安全模型见 gateway/main.go 头注释；修改后重启 im-gateway 生效）

# ============================================================

# 会话 token 验签密钥（必填）：本网关的专属密钥——与 im-server 后台「网关地址簿」中本网关条目的

# 「专属密钥」一致（逐网关独立：泄露/轮换半径=仅本网关，其他网关零影响）。服务端按它为本网关签发

# 客户端隧道 token，并用它验签本网关的写库拉取请求（签名通过=网关身份证明）。

# 仅存本文件，不下发客户端；生产环境务必使用强随机值（64 位十六进制）；更换后须同步服务端地址簿

token_secret: "975bc47d0852cabb56f1bbbfe6562e61fbc518c92175f7003f62b8bb31159c28"
# TCP 透传连接数上限（每组监听独立计数；默认 512）
max_tcp_conns: 512
# UDP 会话数上限（每组监听独立计数；默认 256）
max_udp_sessions: 256
# TLS 证书与私钥路径（相对本文件所在目录）：首次启动若文件不存在会自动生成

# 自签证书（ECDSA P-256，10 年有效），并在日志输出 SHA256 指纹——把该指纹填到

# im-server 的 config.yaml 中 game.gateways 对应条目的 fingerprint 下发给客户端做 pin 校验。

# 客户端只认指纹，不依赖 CA 链，故自签证书即可；更换证书后需同步更新服务端配置
tls_cert: "gateway.crt"
tls_key: "gateway.key"
# ============================================================

# 【新格式·推荐】多监听组：单实例监听多个公网端口，每组专属白名单（隔离性等同多实例）

# listens 数组每项 = 一组接入端口（TCP+UDP）+ 该组专属 allow_targets；

# 同组内多台游戏服务端 = 多个白名单端口；不同业务/游戏用不同组隔离

# ============================================================

# listens:

#   - name: "game-a"               # 组名（日志标识；规则经 @网关名 引用时与 im-server 地址簿对应）

#     listen_tcp: "0.0.0.0:30100"  # 该组 TLS 监听（TCP 数据面 + UDP 控制面同端口）

#     listen_udp: "0.0.0.0:30100"  # 该组 UDP 数据面监听（可与 TCP 同号）

#     allow_targets: [3054, 3053]  # 该组专属白名单（如登录口 3054 + 游戏口 3053 一组）

#   - name: "game-b"

#     listen_tcp: "0.0.0.0:30101"

#     listen_udp: "0.0.0.0:30101"

#     allow_targets: [7777]

#

# 注意：listens 与下方旧格式二选一；同时存在时 listens 优先（旧字段被忽略）。

# 各组 TCP 监听地址不可重复（同机同端口必冲突，启动即报错）。

# ============================================================

# 【旧格式·仍兼容】单监听（listens 为空时自动按此启用，等价 name=default 的一组）

# ============================================================

# TLS 监听地址（TCP 数据面 + UDP 控制面共用此端口）：PC 客户端转发器经公网连接此端口
listen_tcp: "0.0.0.0:30100"
# UDP 数据面监听地址（加密数据报收发；可与 listen_tcp 同端口，TCP/UDP 协议栈互不相干）
listen_udp: "0.0.0.0:30100"
# 目标端口白名单（必填）：客户端 token 验签通过后，仅允许把流量透传到本机 127.0.0.1 的这些端口

# （真实游戏服务端请只监听 127.0.0.1 并在防火墙关闭其对外端口；白名单外的目标一律拒绝）。

# 管理端为游戏配置的 gw 前缀转发规则（如 gtcp:7777=7777）中的远端端口必须落在此白名单内。

# 亦可在 Web 后台编辑（见下方 admin_listen）——后台保存即热生效并自动回写本文件
allow_targets:
    - 7777
    - 6112
# ============================================================

# 【可选】Web 管理后台（admin_listen 与 admin_password 齐备才启动）

# 浏览器访问 http://<admin_listen> 登录：总览各监听组状态 + 白名单在线热更（落盘本文件）

# 安全约定：默认仅绑 127.0.0.1（本机/SSH 隧道访问，零公网暴露面）；密码务必强随机

# ============================================================
admin_listen: "127.0.0.1:30101"
admin_password: "admin123"
dbwrite:
    enabled: true
    gateway_name: ln-001
    im_addr: https://im.sxgyxny.com
    type: mysql
    dsn: root:root@tcp(127.0.0.1:3306)/main
    strategy: upsert
    poll_sec: 30
    sql_insert: INSERT INTO user(Name, Password) VALUES({user}, {password})
    sql_update: UPDATE user SET Password={password} WHERE Name={user}

# ============================================================

# 【可选】游戏账号写库（enabled 才启动拉取器；链路见 docs/网关开发文档.md）

# ★ 支持在 Web 后台在线编辑本节全部字段（连接/库/表/字段=改 SQL 模板）→ 保存即热生效

#   （连接池重建/模板重编译）并自动回写本文件，无需重启网关；「测试连接」按钮可提前验证 DSN。

# 流程：玩家在 IM 登录 → im-server 队列落 {账号, 启动密码} → 本网关按 poll_sec 周期拉取

# （HMAC 签名 + 响应 AES-GCM 加密）→ 按下方 SQL 模板参数化写入本机游戏库 → 回执。

# 写库失败不回执自动重试；写库链路异常绝不影响游戏隧道转发

# ============================================================

# dbwrite:

#   enabled: true

#   gateway_name: "game-a"                  # 自报网关名（= im-server 后台「网关地址簿」中的条目名，服务端据此按网关过滤队列）

#   im_addr: "http://im服务器地址:2087"     # im-server 拉取地址（走 2087 现有端口，零新增暴露面）

#   type: mysql                            # mysql / mssql / postgres / sqlite（四类型全支持，均为纯 Go 驱动）

#   dsn: "user:pass@tcp(127.0.0.1:3306)/gamedb"

#                                          # postgres 例：postgres://user:pass@127.0.0.1:5432/gamedb

#                                          # sqlite 例：file:gamedb.db（相对网关工作目录）

#   strategy: upsert                        # insert=只执行 sql_insert / update=只执行 sql_update / upsert=先 UPDATE 零命中再 INSERT

#   poll_sec: 30                            # 拉取周期（默认 30s，5~600）

#   sql_insert: "INSERT INTO members(account, password) VALUES({user}, {password})"

#   sql_update: "UPDATE members SET password={password} WHERE account={user}"

# 模板规则（启动即校验，非法拒绝启动写库）：

#   语句白名单：INSERT / UPDATE（内部可任意复杂——子查询/JOIN/INSERT..SELECT/多表关联更新）、

#   MERGE（MSSQL、PG15+，自带 WHEN MATCHED/NOT MATCHED 全语义）、CALL/EXEC/EXECUTE 存储过程

#   （复杂多表+事务逻辑写在游戏库端过程体，网关只带参调用，安全模型不变；sqlite 无过程不支持）；

#   禁分号多语句（MERGE 尾分号豁免）、禁 -- 与 /* 注释；DELETE/DROP/TRUNCATE/ALTER/CREATE 一律拒绝；

#   占位符仅 {user}（IM 账号）{password}（16 位启动密码，同账号恒定；与启动参数 {1} 同源）；

#   强制参数绑定执行，注入免疫。若游戏侧密码列存哈希，可写 MD5({password}) 等数据库函数处理。

#   merge/call/exec 类模板自带全语义：无论 strategy 均单次执行（不参与 upsert 组合，防重复写）

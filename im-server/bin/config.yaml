# IM 服务端核心配置（与《开发文档》5.2 保持一致）
# 说明：本文件由服务端启动时读取，缺省项自动回退内置默认值

# WebSocket 监听地址
ws_addr: ":8888"
# 心跳超时时间（秒）：超过该时间未收到任何消息判定离线
heartbeat_timeout: 90
# 心跳发送间隔（秒，客户端侧）
heartbeat_interval: 30
# 文件分片大小（字节）
chunk_size: 4096
# 最大在线连接数
max_connections: 1000
# 消息撤回时间窗口（秒）：仅该窗口内自己发送的消息可撤回
recall_window: 120

# MySQL 数据源
mysql_dsn: "root:root@tcp(127.0.0.1:3306)/im?charset=utf8mb4&parseTime=True&loc=Local"
# Redis 配置
redis_addr: "127.0.0.1:6379"
redis_password: ""
redis_db: 0

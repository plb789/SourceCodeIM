# IM 服务端核心配置（与《开发文档》5.2 保持一致）
# 说明：本文件由服务端启动时读取，缺省项自动回退内置默认值

# WebSocket 监听地址
ws_addr: ":8888"
# 心跳超时时间（秒）：超过该时间未收到任何消息判定离线
heartbeat_timeout: 90
# 心跳发送间隔（秒，客户端侧）
heartbeat_interval: 30
# 文件分片大小（字节）
# 原实现：chunk_size: 4096（4KB 分片在大文件场景产生海量 WS 消息与 Redis 操作，20MB 文件需 5120 片）
# 阶段三十一：提升至 64KB（base64 后约 87KB，仍在服务端单条消息 1MB 读取上限内），消息数降 16 倍
chunk_size: 65536
# 最大在线连接数（阶段三十一起在 HandleWS 实际执行校验，原实现该配置从未生效）
# 原实现：max_connections: 1000
max_connections: 10000
# 单连接发送队列缓冲条数（阶段三十一：文件分片与聊天消息共用队列，过小会溢出丢消息）
# 原实现：固定 256
send_queue_size: 1024
# 大文件直传阈值（字节，阶段三十一）：超过该值走 HTTP 直传链路（服务端流式落盘），WebSocket 仅传信令
http_upload_threshold: 1048576
# 单请求直传大小上限（字节）：1MB~20MB 走单请求直传；超过该值走分片直传（阶段三十二）
max_file_size: 20971520
# 分片直传单片大小（字节，阶段三十二）：超大文件按该值分片逐片 HTTP 上传（服务端节流推送接收进度）
upload_chunk_size: 4194304
# 分片直传文件大小上限（字节，阶段三十二）：超过该值前端直接拒绝发送
max_direct_size: 2147483648
# 消息撤回时间窗口（秒）：仅该窗口内自己发送的消息可撤回
recall_window: 120

# MySQL 数据源
mysql_dsn: "root:root@tcp(127.0.0.1:3306)/im?charset=utf8mb4&parseTime=True&loc=Local"
# Redis 配置
redis_addr: "127.0.0.1:6379"
redis_password: ""
redis_db: 0

# 前端静态目录（缺省留空：自动从 exe 所在目录逐级向上查找 im-client/web；相对路径基于 exe 所在目录解析）
web_dir: ""
# 阶段二十四：聊天文件持久化存储目录
# 原实现：upload_dir: "../im-client/web/static/upload"（相对进程工作目录，仅根目录启动时正确）
# 现改为留空：由服务端基于 web_dir 自动推导（exe 位于 bin 时推导结果为 im-client/web/static/upload）；如需自定义可配置绝对路径
# upload_dir: "../im-client/web/static/upload"
# 阶段二十四：聊天文件持久化大小上限（字节，默认 20MB）
# 阶段三十二：语义调整为"单请求直传上限"，1MB~20MB 走单请求直传，超过走分片直传（上限见 max_direct_size）
# max_file_size: 20971520

# ============================================================
# 阶段四十三：AI 问答配置（服务端归口：API 地址与密钥仅存本文件，客户端不接触密钥）
# providers 为 OpenAI 兼容 chat/completions 接口（可接 DeepSeek/Kimi/智谱/通义/OpenAI 等）
# agents 为面向用户的智能体，通过 provider 名称绑定模型服务；未配置时内置"AI助手"（本地 Mock 应答）
# 修改后需重启服务端生效
# ============================================================
# ============================================================
# AI 问答配置（服务端归口：密钥仅存本文件，客户端不接触；修改后重启服务端生效）
# ============================================================
ai:
  # 多轮对话携带的历史消息条数（按 用户+智能体 隔离取最近 N 条）
  context_window: 20
  # 限流：单用户在 limit_window 秒内最多提问 limit_count 次
  limit_count: 10
  limit_window: 60
  # 阶段四十五：文档问答单文档提取文本上限（字符），超出截断后再送模型
  doc_max_chars: 60000

  # 模型服务列表（可同时配置多个，智能体按 name 绑定）
  # supports_image: 是否支持图片识别（多模态模型如 glm-4v/qwen-vl/gpt-4o 填 true，
  # 为 true 时绑定的智能体开放图片提问入口，前端可发图片给模型识别）
  providers:
    # DeepSeek
    - name: deepseek
      api_url: "https://api.deepseek.com/v1/chat/completions"
      api_key: "sk-你的密钥"
      model: "deepseek-chat"          # 推理模型可换 deepseek-reasoner
      supports_image: false
    # 智谱 GLM
    - name: zhipu
      api_url: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
      api_key: "你的密钥"
      model: "glm-4-flash"            # 免费额度模型；高端可换 glm-4-plus
      supports_image: false
    # 智谱视觉模型（图片识别示例：绑定到智能体后可发图提问）
    # - name: zhipu-vision
    #   api_url: "https://open.bigmodel.cn/api/paas/v4/chat/completions"
    #   api_key: "你的密钥"
    #   model: "glm-4v-plus"
    #   supports_image: true
    # Kimi (Moonshot)
    - name: kimi
      api_url: "https://api.moonshot.cn/v1/chat/completions"
      api_key: "sk-你的密钥"
      model: "moonshot-v1-8k"
    # 通义千问（DashScope 兼容模式）
    - name: qwen
      api_url: "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"
      api_key: "sk-你的密钥"
      model: "qwen-plus"
    # OpenAI
    - name: openai
      api_url: "https://api.openai.com/v1/chat/completions"
      api_key: "sk-你的密钥"
      model: "gpt-4o-mini"
    # 本地 Ollama（无需密钥，api_key 留空即可）
    - name: ollama
      api_url: "http://127.0.0.1:11434/v1/chat/completions"
      api_key: ""
      model: "gemma4:26b"
    # 阶段四十五 E2E 临时：文档导出/问答测试用 provider（实测完毕已停用，需要时取消注释并启动 tmpmock mockdoc）
    # - name: doc-mock
    #   api_url: "http://127.0.0.1:19128/v1/chat/completions"
    #   api_key: "mock-key"
    #   model: "mock-doc"
    #   supports_image: true

  # 智能体列表（左侧 AI 图标里可选的聊天助手；provider 未启用时该智能体降级为本地演示应答）
  agents:
    - name: "AI助手"                   # 全局唯一，会话列表展示名
      provider: deepseek               # 绑定上面的 provider name
      system_prompt: "你是一个即时通讯软件内的智能助手，回答简洁、准确、友好，使用中文回复。"
      avatar: ""                       # 头像 URL，留空时前端显示 🤖 占位
    - name: "翻译助手"
      provider: zhipu
      system_prompt: "你是一个专业翻译助手：自动检测用户输入的语言，中文译英文、其他语言译中文，仅输出译文，不要解释。"
      avatar: ""
    - name: "编程助手"
      provider: kimi
      system_prompt: "你是一个资深编程助手，用中文回答技术问题，先给结论再给可运行的代码示例。"
      avatar: ""
    - name: "创意写作"
      provider: qwen
      system_prompt: "你是一个创意写作助手，擅长文案、故事与润色，风格生动自然。"
      avatar: ""
    - name: "本地测试"
      provider: ollama
      system_prompt: "你是一个创意写作助手，擅长文案、故事与润色，风格生动自然。"
      avatar: ""
    # 阶段四十五 E2E 临时：导出测试智能体（配套 doc-mock，实测完毕已停用）
    # - name: "导出测试"
    #   provider: doc-mock
    #   system_prompt: "你是文档生成测试助手。"
    #   avatar: ""
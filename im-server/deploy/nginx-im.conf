# ---------- 部署注意 ----------
# 1. 源 IP 变化：四层/七层转发后服务端看到的连接源 IP 为 Nginx 地址，
#    服务端"单 IP 连接频率限制"（ip_conn_limit）的统计对象会合并为 Nginx 出口——
#    办公网 NAT 场景请同步调大 ip_conn_limit（config.yaml）。
#    （另：当前该限制的键含对端端口，实际从未真实生效——修复时需一并考虑 LB 源 IP 场景）
# 2. 管理后台/仪表盘显示的是"所连实例"的本机指标，多实例下各端口独立查看；
#    聚合视图为二期项。
# 3. 通话/会议 TURN 中继绑定具体机器：多实例同机须关闭或错开 turn.port 与中继端口段
#    （副实例模板 bin/node2/config.yaml 已关闭）。
# 4. 文件上传/网盘等带用户上下文的 HTTP 接口：单机多实例共享磁盘天然一致；
#    跨机部署须共享存储（网盘后端 MinIO 或共享挂载）。

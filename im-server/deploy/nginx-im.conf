# ============================================================
# IM 服务端横向扩展：Nginx 入口负载均衡配置模板
# 拓扑：客户端 → Nginx(本文件) → im-server 实例 ×N（共享同一 MySQL / Redis，
#       cluster_enabled=true 且 cluster_channel 一致，ws_addr 各实例不同端口）
# 实测基线：集群总线每条群消息仅 O(实例数) 条信封复制（E2 攒批 Pipeline），
#           广播 fanout 由各实例对本地连接独立执行，CPU/IO 随实例数分摊
# 用法：nginx -c 本文件路径；按实际实例端口增删 upstream server 行
# ============================================================

# ---------- 方案 A（推荐）：TCP 四层透传（stream 模块，WS 升级零改造） ----------
stream {
    upstream im_ws {
        # least_conn：长连接场景按当前连接数分发；新增实例直接加一行
        least_conn;
        server 127.0.0.1:8888;   # 主实例
        server 127.0.0.1:8889;   # 副实例（bin/node2/config.yaml，ws_addr=:8889）
        # server 10.0.0.11:8888; # 跨机实例（同 MySQL/Redis/总线频道）
    }

    server {
        listen 9000;             # 客户端统一接入端口（前端 WS 地址改连此端口）
        proxy_pass im_ws;
        proxy_connect_timeout 5s;
        # 长连接空闲超时须大于服务端心跳周期（heartbeat_timeout=90s），防 LB 先掐空闲连接
        proxy_timeout 300s;
    }
}


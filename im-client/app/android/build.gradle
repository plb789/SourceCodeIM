// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {

    repositories {
        // 原实现：google()/mavenCentral()（境外仓库，本机网络 TLS 阻断导致依赖下载失败）
        // 改为阿里云镜像优先，原始仓库兜底
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
        // 阶段二百二十六：EMAS 官方 maven 仓库（alicloud-android-push 仅发布于此，
        // 不在 google/central；官方文档 https://help.aliyun.com/ 文档指定仓库地址）
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/releases/' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.2.1'
        classpath 'com.google.gms:google-services:4.4.0'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // 原实现：google()/mavenCentral()（境外仓库，本机网络 TLS 阻断导致依赖下载失败）
        // 改为阿里云镜像优先，原始仓库兜底
        maven { url 'https://maven.aliyun.com/repository/google' }
        maven { url 'https://maven.aliyun.com/repository/central' }
        // 阶段二百二十六：EMAS 官方 maven 仓库（同 buildscript，供 :app 模块解析 SDK 依赖）
        maven { url 'https://maven.aliyun.com/nexus/content/repositories/releases/' }
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <!-- 阶段九十二：内置浏览区文件查看页（PC 端 file kind 标签专用，TRAE CN 归一）。
         由 PC 主进程 BrowserView 加载（服务端同源静态文件），外部网页进不了本页所在分区。
         入口：主进程 executeJavaScript 注入 window.__wsFileLoad(jsonStr)（双重 stringify，
         页内 JSON.parse 无注入面）。能力：docx/xlsx/pptx/图片/pdf 预览 + 文本/代码高亮 +
         md/diff/审查报告渲染 + 文本编辑保存（经 viewer-preload 窄桥，路径由主进程归口）。
         Web/手机端用户不会导航到本页（无入口），imviewer 桥不存在时编辑按钮自动隐藏 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP：仅同源资源 + blob/data 媒体；SheetJS/PPTXjs 内部需 eval，故放开 unsafe-eval；
         worker-src 'self' blob: 必须放行——Monaco 新版 defaultWorkerFactory 一律用 URL.createObjectURL(blob)
         创建 Worker，diff 计算（computeDiff）跑在 editorWorker 里，blob: 被拦则 diff 行级红绿装饰
         与"仅变更"折叠全部静默失效（实测无报错，仅控制台 worker 警告），样式看着像普通双栏文本 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; font-src 'self' data:">
    <title>文件预览</title>
    <!-- 阶段一百零九：首帧防白闪——hljs 样式与 5 个大库脚本（highlight/mammoth/jszip/PptxViewJS/xlsx
         合计数 MB）同步阻塞解析，完整 <style> 又排在它们之后：首次打开（冷缓存）时新文档先以
         UA 默认白底出现，库全部加载执行完才首绘出主题底色，形成"白闪一下"；二次打开走磁盘缓存
         毫秒级完成无感。此内联脚本在一切阻塞资源之前同步执行：读同源 localStorage im_theme
         （与主程序共享）直接给 html 设主题底色并预置 data-theme，首绘即正确主题色 -->
    <script>
        (function () {
            var t = 'light';
            try { t = localStorage.getItem('im_theme') || 'light'; } catch (e) {}
            var dark = t === 'dark' || (t === 'system' &&
                window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.background = dark ? '#111111' : '#f5f5f5';
        })();
    </script>
    <link rel="stylesheet" href="css/hljs-github-dark.css?v=11.9">
    <script src="js/lib/highlight.min.js?v=11.9"></script>
    <script src="js/lib/mammoth.browser.min.js?v=1.0"></script>
    <script src="js/lib/jszip.min.js?v=3.10"></script>
    <!-- 阶段一百三十四：Chart.js UMD——PptxViewJS 非 AMD 环境从全局取 window.Chart（图表渲染依赖），
         缺失导致 PPT 预览报 "Chart is required but was not found"；必须在 PptxViewJS 之前加载 -->
    <script src="js/lib/Chart.min.js?v=4.4.9"></script>
    <script src="js/lib/PptxViewJS.min.js?v=1.0"></script>
    <script src="js/lib/xlsx.full.min.js?v=0.20"></script>
    <style>
        /* 阶段一百零八：TRAE CN 同款代码字体 JetBrains Mono（与主程序 style.css 同一套本地 woff2 与
           'JetBrains Mono IM' 命名约定，中文回退系统字体；viewer 在 web 根目录故路径不带 ../） */
        @font-face {
            font-family: 'JetBrains Mono IM';
            src: url('fonts/JetBrainsMono-400.woff2') format('woff2');
            font-weight: 400;
            font-style: normal;
            font-display: swap;
        }
        @font-face {
            font-family: 'JetBrains Mono IM';
            src: url('fonts/JetBrainsMono-500.woff2') format('woff2');
            font-weight: 500;
            font-style: normal;
            font-display: swap;
        }
        /* 主题变量：跟随主程序 im_theme（light/dark/system，同源 localStorage 共享）。
           界面面（顶栏/正文/边框/表格/引用/按钮）随主题切换；代码块面保持深色恒定
           （主程序 AI 代码块豆包同款 #0d1117，hljs GitHub Dark 双主题通用） */
        :root {
            --fv-bg: #f5f5f5;            /* 页面背景（主程序 --bg） */
            --fv-bar-bg: #fafafa;        /* 顶栏/对比头（主程序 --header-bg） */
            --fv-panel: #ffffff;         /* 浮层块底（主程序 --panel-bg） */
            --fv-border: #e0e0e0;        /* 边框（主程序 --border） */
            --fv-text: #333333;          /* 正文（主程序 --text） */
            --fv-title: #333333;         /* 标题强调字色 */
            --fv-text-light: #999999;    /* 次级文字（主程序 --text-light） */
            --fv-primary: #07c160;       /* 主题色（微信绿，双主题同值） */
            --fv-hover: #e8e8e8;         /* 悬停底色 */
            --fv-quote-bg: #f0f0f0;      /* 引用/表头底色 */
            --fv-inline-bg: #eaeaea;     /* 行内代码底 */
            --fv-inline-fg: #c7254e;     /* 行内代码字色 */
            --fv-link: #0366d6;          /* 链接色 */
            --fv-scroll: #c8c8c8;        /* 滚动条拇指 */
            --fv-banner-bg: #fdf3d9;     /* 提示横幅底 */
            --fv-banner-fg: #8a6d1a;     /* 提示横幅字色 */
            --fv-warn: #b8860b;          /* 脏状态字色 */
            --fv-ok: #1a7f37;            /* 保存成功字色 */
            --fv-code-surface: #0d1117;  /* 代码块面（深色恒定，豆包同款） */
        }
        [data-theme="dark"] {
            --fv-bg: #111111;
            --fv-bar-bg: #1a1a1a;
            --fv-panel: #1e1e1e;
            --fv-border: #333333;
            --fv-text: #e0e0e0;
            --fv-title: #f0f0f0;
            --fv-text-light: #8a8a8a;
            --fv-primary: #07c160;
            --fv-hover: #2a2a2a;
            --fv-quote-bg: #2a2a2a;
            --fv-inline-bg: #2f3035;
            --fv-inline-fg: #e8bf7a;
            --fv-link: #6db3f2;
            --fv-scroll: #4a4b50;
            --fv-banner-bg: #3a3325;
            --fv-banner-fg: #e5b567;
            --fv-warn: #e5b567;
            --fv-ok: #7ec699;
            --fv-code-surface: #0d1117;
        }
        /* 跟随系统：系统为深色时同 dark 主题（与主程序 style.css 同口径） */
        @media (prefers-color-scheme: dark) {
            [data-theme="system"] {
                --fv-bg: #111111;
                --fv-bar-bg: #1a1a1a;
                --fv-panel: #1e1e1e;
                --fv-border: #333333;
                --fv-text: #e0e0e0;
                --fv-title: #f0f0f0;
                --fv-text-light: #8a8a8a;
                --fv-primary: #07c160;
                --fv-hover: #2a2a2a;
                --fv-quote-bg: #2a2a2a;
                --fv-inline-bg: #2f3035;
                --fv-inline-fg: #e8bf7a;
                --fv-link: #6db3f2;
                --fv-scroll: #4a4b50;
                --fv-banner-bg: #3a3325;
                --fv-banner-fg: #e5b567;
                --fv-warn: #e5b567;
                --fv-ok: #7ec699;
                --fv-code-surface: #0d1117;
            }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            display: flex; flex-direction: column;
            background: var(--fv-bg); color: var(--fv-text);
            font-family: "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 13px;
            overflow: hidden;
        }
        /* 顶栏：文件名 + 状态 + 操作按钮 */
        #fv-bar {
            flex: none; display: flex; align-items: center; gap: 8px;
            padding: 7px 12px; border-bottom: 1px solid var(--fv-border); background: var(--fv-bar-bg);
        }
        #fv-name {
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 13px; font-weight: 600; color: var(--fv-title);
        }
        #fv-status { flex: none; font-size: 12px; color: var(--fv-text-light); }
        #fv-status.dirty { color: var(--fv-warn); }
        #fv-status.saved { color: var(--fv-ok); }
        .fv-btn {
            flex: none; padding: 4px 14px; border: 1px solid var(--fv-border); border-radius: 4px;
            background: transparent; color: var(--fv-text); font-size: 12px; cursor: pointer;
        }
        .fv-btn:hover { background: var(--fv-hover); }
        .fv-btn.primary { background: var(--fv-primary); border-color: var(--fv-primary); color: #fff; }
        .fv-btn.primary:hover { filter: brightness(1.1); }
        .fv-btn.hidden { display: none; }
        /* 内容区：整体滚动（顶栏固定） */
        #fv-body { flex: 1; min-height: 0; overflow: auto; position: relative; }
        #fv-body::-webkit-scrollbar { width: 8px; height: 8px; }
        #fv-body::-webkit-scrollbar-track { background: transparent; }
        #fv-body::-webkit-scrollbar-thumb { background: var(--fv-scroll); border-radius: 4px; }
        #fv-body::-webkit-scrollbar-thumb:hover { filter: brightness(0.85); }
        .fv-hint { padding: 14px 16px; color: var(--fv-text-light); font-size: 12px; }
        .fv-banner {
            margin: 12px 16px 0; padding: 8px 12px; border-radius: 6px;
            background: var(--fv-banner-bg); color: var(--fv-banner-fg); font-size: 12px;
        }
        /* 代码/文本：行号列 + 高亮代码（同字体行高严格对齐，行号 sticky）。
           代码面深色恒定（hljs GitHub Dark 调色板双主题通用，豆包同款） */
        .fv-code-wrap { display: flex; align-items: flex-start; min-width: max-content; padding: 10px 0; background: var(--fv-code-surface); }
        .fv-code-ln {
            position: sticky; left: 0; z-index: 1; flex: none;
            padding: 0 10px 12px; text-align: right; min-width: 46px;
            background: var(--fv-code-surface); color: #6e7681; user-select: none;
            font: 12px/1.55 "JetBrains Mono IM", "Cascadia Code", Consolas, "Courier New", monospace; white-space: pre;
            border-right: 1px solid #30363d;
        }
        .fv-code-wrap pre { padding: 0 16px 12px 12px; background: transparent; }
        .fv-code-wrap code { font: 12px/1.55 "JetBrains Mono IM", "Cascadia Code", Consolas, "Courier New", monospace; background: transparent; color: #c9d1d9; }
        /* 阶段九十五：编辑态唯一内核 = Monaco（TRAE/VS Code 同款编辑内核）。
           旧 textarea+hljs 双叠层方案因中英混排两套布局引擎字体 fallback 宽度不一致、
           永远存在像素级错位，已整体裁除。Monaco 自渲染自带滚动条（可主题化）。 */
        #fv-monaco { position: relative; display: none; height: calc(100vh - 46px); min-height: 320px; background: var(--fv-bg); }
        /* md / docx 排版（对齐主程序 ai-md 观感：表格边框/代码块深底/引用线） */
        .fv-md { padding: 16px 20px; line-height: 1.7; font-size: 13.5px; max-width: 980px; }
        .fv-md h1, .fv-md h2, .fv-md h3, .fv-md h4 { margin: 18px 0 10px; line-height: 1.4; color: var(--fv-title); }
        .fv-md h1 { font-size: 22px; } .fv-md h2 { font-size: 18px; } .fv-md h3 { font-size: 15.5px; }
        .fv-md p { margin: 8px 0; }
        .fv-md ul, .fv-md ol { margin: 8px 0; padding-left: 26px; }
        .fv-md li { margin: 3px 0; }
        .fv-md blockquote {
            margin: 10px 0; padding: 6px 14px; border-left: 3px solid var(--fv-primary);
            background: var(--fv-quote-bg); color: var(--fv-text-light); border-radius: 0 6px 6px 0;
        }
        .fv-md code { background: var(--fv-inline-bg); border: 1px solid var(--fv-border); border-radius: 4px; padding: 1px 6px; font: 12px "JetBrains Mono IM", "Cascadia Code", Consolas, "Courier New", monospace; color: var(--fv-inline-fg); }
        .fv-md pre.fv-md-code { background: var(--fv-code-surface); border: 1px solid #30363d; border-radius: 8px; padding: 12px 14px; overflow: auto; margin: 10px 0; }
        .fv-md pre.fv-md-code code { background: transparent; border: none; padding: 0; color: #c9d1d9; font: 12px/1.55 "JetBrains Mono IM", "Cascadia Code", Consolas, "Courier New", monospace; }
        .fv-md table { border-collapse: collapse; margin: 10px 0; max-width: 100%; display: block; overflow: auto; }
        .fv-md th, .fv-md td { border: 1px solid var(--fv-border); padding: 6px 12px; font-size: 12.5px; }
        .fv-md th { background: var(--fv-quote-bg); color: var(--fv-title); }
        .fv-md a { color: var(--fv-link); }
        .fv-md hr { border: none; border-top: 1px solid var(--fv-border); margin: 14px 0; }
        /* xlsx：sheet 切换条 + HTML 表格 */
        .fv-xlsx-tabs { display: flex; gap: 6px; flex-wrap: wrap; padding: 12px 16px 0; }
        .fv-xlsx-chip {
            padding: 4px 12px; border: 1px solid var(--fv-border); border-radius: 12px;
            font-size: 12px; color: var(--fv-text-light); cursor: pointer; user-select: none;
        }
        .fv-xlsx-chip:hover { background: var(--fv-quote-bg); }
        .fv-xlsx-chip.active { background: var(--fv-primary); border-color: var(--fv-primary); color: #fff; }
        .fv-xlsx-body { padding: 12px 16px 20px; }
        .fv-xlsx-body table { border-collapse: collapse; }
        .fv-xlsx-body td { border: 1px solid var(--fv-border); padding: 4px 10px; font-size: 12.5px; max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fv-xlsx-body tr:first-child td { background: var(--fv-quote-bg); color: var(--fv-title); font-weight: 600; }
        /* 媒体：图片/PDF 居中自适应 */
        .fv-media { display: flex; justify-content: center; padding: 20px; }
        .fv-media img { max-width: 96%; max-height: calc(100vh - 120px); border-radius: 6px; }
        .fv-media embed { width: 96%; height: calc(100vh - 110px); border: none; border-radius: 6px; }
        /* diff 提交详情元信息头 */
        .fv-commit-meta { padding: 14px 20px 0; }
        .fv-commit-subject { font-size: 14.5px; font-weight: 600; color: var(--fv-title); margin-bottom: 4px; }
        .fv-commit-info { font-size: 12px; color: var(--fv-text-light); }
        /* 阶段九十六：Monaco diff 对比视图（kind=diff/commit 专用，VS Code 同款对比器） */
        #fv-diff-wrap { flex: 1; min-height: 0; display: none; flex-direction: column; }
        #fv-diff-head {
            flex: none; display: flex; align-items: center; gap: 8px;
            padding: 7px 12px; border-bottom: 1px solid var(--fv-border); background: var(--fv-bar-bg);
        }
        #fv-diff-info {
            flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
            font-size: 12px; color: var(--fv-text-light);
        }
        #fv-diff-info .fv-commit-subject { font-size: 13px; margin-bottom: 2px; }
        #fv-diff-info .fv-commit-info { font-size: 11.5px; }
        #fv-diff { flex: 1; min-height: 0; background: var(--fv-bg); }
        /* 阶段九十七：红蓝绿 gutter（TRAE CN 同款配色：新增绿条/修改蓝条/删除红块）
           阶段一百五十八：色条收窄 2.5px+圆角（::before 绘制，border-left 无法圆角），三色保持 git 语义不随主题翻转 */
        .fv-btn.danger { border-color: #cf222e; color: #e5534b; }
        .fv-btn.danger:hover { background: rgba(207, 34, 46, 0.15); }
        .fv-g-add, .fv-g-mod, .fv-g-del { position: relative; }
        .fv-g-add::before, .fv-g-mod::before { content: ''; position: absolute; left: 4px; top: 2px; bottom: 2px; width: 2.5px; border-radius: 2px; }
        .fv-g-add::before { background: #2da44e; }
        .fv-g-mod::before { background: #316dca; }
        .fv-g-del::before { content: ''; position: absolute; left: 4px; top: 50%; transform: translateY(-50%); width: 9px; height: 3px; background: #cf222e; border-radius: 2px; }
        /* 阶段一百一十一：变更整行背景（TRAE CN 同款：新增绿底/修改蓝底）+ 变更导航胶囊 */
        .fv-tl-add { background: rgba(46, 160, 67, 0.16); }
        .fv-tl-mod { background: rgba(56, 139, 253, 0.15); }
        .fv-task-nav {
            flex: none; display: inline-flex; align-items: center; gap: 1px;
            padding: 0 3px; height: 24px; border: 1px solid var(--fv-border); border-radius: 12px;
            background: var(--fv-panel); font-size: 11px; color: var(--fv-text);
        }
        .fv-task-nav.hidden { display: none; }
        .fv-nav-btn { border: none; background: transparent; color: var(--fv-text); font-size: 15px; line-height: 1; width: 18px; height: 20px; cursor: pointer; border-radius: 4px; padding: 0; }
        .fv-nav-btn:hover { background: rgba(128, 128, 128, 0.2); }
        #fv-nav-pos { min-width: 30px; text-align: center; color: var(--fv-text-light); }
        /* pptx */
        .fv-pptx { padding: 16px; text-align: center; }
        .fv-pptx-bar { display: flex; justify-content: center; align-items: center; gap: 12px; margin-bottom: 12px; }
        .fv-pptx-btn { padding: 5px 16px; border: 1px solid var(--fv-border); border-radius: 4px; background: var(--fv-panel); color: var(--fv-text); font-size: 12px; cursor: pointer; }
        .fv-pptx-btn:hover { background: var(--fv-hover); }
        .fv-pptx-idx { font-size: 12px; color: var(--fv-text-light); min-width: 64px; }
        .fv-pptx-canvas { max-width: 96%; border-radius: 6px; background: #fff; }
        /* 阶段一百一十：Monaco 右键菜单中文化——自绘菜单（禁用内置英文菜单，符合"禁用系统默认弹窗"规约；
           配色全走 fv 主题变量，深浅主题自动跟随） */
        .fv-ctx-menu {
            position: fixed; z-index: 10000; min-width: 190px;
            padding: 4px;
            background: var(--fv-panel); color: var(--fv-text);
            border: 1px solid var(--fv-border); border-radius: 8px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            font-size: 12px; user-select: none;
        }
        .fv-ctx-item {
            display: flex; align-items: center; justify-content: space-between; gap: 24px;
            padding: 6px 12px; border-radius: 5px; cursor: pointer; white-space: nowrap;
        }
        .fv-ctx-item:hover { background: var(--fv-hover); }
        .fv-ctx-key { color: var(--fv-text-light); font-size: 11px; }
        .fv-ctx-sep { height: 1px; margin: 4px 8px; background: var(--fv-border); }
        /* ===== 阶段一百五十八：AI 修改说明悬停浮层（TRAE CN 同款）=====
           自绘绝对定位 DOM（非 Monaco overlayWidget）：触发区在 gutter、含回滚按钮交互、不受编辑器 overflow 裁剪；
           配色全走 --fv-* 双主题变量自动跟随；徽标三色与 gutter git 语义一致（新增绿/修改蓝/删除红） */
        #fv-ai-pop {
            position: fixed; z-index: 10001; max-width: 420px;
            padding: 10px 12px; border: 1px solid var(--fv-border); border-radius: 8px;
            background: var(--fv-panel); color: var(--fv-text);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18);
            font-size: 12px; line-height: 1.5; user-select: none; display: none;
        }
        #fv-ai-pop.show { display: block; }
        #fv-ai-pop .fv-ai-pop-head { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
        #fv-ai-pop .fv-ai-pop-lines { margin-left: auto; color: var(--fv-text-light); font-size: 11px; white-space: nowrap; }
        .fv-ai-badge { flex: none; display: inline-flex; align-items: center; height: 16px; padding: 0 7px; border-radius: 8px; font-size: 11px; font-weight: 600; }
        .fv-ai-badge.b-add { background: rgba(46, 160, 67, 0.16); color: #2da44e; }
        .fv-ai-badge.b-mod { background: rgba(56, 139, 253, 0.16); color: #3f8cff; }
        .fv-ai-badge.b-del { background: rgba(207, 34, 46, 0.14); color: #e5534b; }
        .fv-add { color: #2da44e; }
        .fv-del { color: #e5534b; }
        #fv-ai-pop .fv-ai-pop-stat { font-size: 11px; display: inline-flex; gap: 6px; white-space: nowrap; }
        #fv-ai-pop .fv-ai-pop-text { max-height: 96px; overflow-y: auto; white-space: pre-wrap; word-break: break-all; }
        #fv-ai-pop .fv-ai-pop-text::-webkit-scrollbar { width: 6px; }
        #fv-ai-pop .fv-ai-pop-text::-webkit-scrollbar-track { background: transparent; }
        #fv-ai-pop .fv-ai-pop-text::-webkit-scrollbar-thumb { background: var(--fv-scroll); border-radius: 3px; }
        #fv-ai-pop .fv-ai-pop-foot { display: flex; justify-content: flex-end; margin-top: 8px; }
        #fv-ai-pop .fv-ai-pop-arrow {
            position: absolute; width: 10px; height: 10px; transform: rotate(45deg);
            background: var(--fv-panel); border-left: 1px solid var(--fv-border); border-top: 1px solid var(--fv-border);
            pointer-events: none;
        }
        .fv-tl-hover { background: rgba(128, 128, 128, 0.10); }
        /* diff 头部 AI 说明行 + 统计徽标（TRAE CN 同款：变更文件 diff 预览头部展示修改意图） */
        .fv-diff-expl { display: flex; align-items: center; gap: 6px; margin-top: 3px; color: var(--fv-text); }
        .fv-diff-expl .fv-expl-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fv-diff-stat { display: inline-flex; gap: 6px; font-size: 11px; white-space: nowrap; }
        /* ===== 阶段一百五十九：断点调试 UI（TRAE CN 同款）=====
           gutter 断点红圈（Monaco glyphMargin 装饰）/ 暂停行高亮 / 顶栏控制条 / 底部调试面板；
           配色全走 --fv-* 主题变量，语义色与 gutter git 语义一致（红=断点，黄=暂停行） */
        .monaco-editor .glyph-margin-widgets .cgmr,
        .monaco-editor .margin-view-overlays .cgmr { cursor: pointer; }
        .monaco-editor .margin-view-overlays .line-numbers { cursor: pointer; } /* v=142：行号悬停显空心断点提示，光标同步 pointer（TRAE CN 同款） */
        .fv-bp-dot::before {
            content: ''; display: block; width: 11px; height: 11px; margin: 5px 0 0 9px;
            border-radius: 50%; background: #e5534b; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
        }
        /* TRAE CN 同款：悬停行号/glyph 槽时该行显空心红点（提示可点击打断点；已打断点的行不叠加） */
        .fv-bp-hover-dot::before {
            content: ''; display: block; width: 11px; height: 11px; margin: 5px 0 0 9px;
            border-radius: 50%; border: 1.5px solid rgba(229, 83, 75, 0.7); box-sizing: border-box;
            background: transparent;
        }
        .fv-dbg-line-hl { background: rgba(229, 181, 103, 0.20); }
        .fv-dbg-line-arrow::before {
            content: ''; display: block; width: 0; height: 0; margin: 4px 0 0 9px;
            border-top: 6.5px solid transparent; border-bottom: 6.5px solid transparent;
            border-left: 11px solid #e5b567; /* VS Code 同款暂停行黄箭头 */
        }
        #fv-dbg-ctrl { flex: none; display: flex; align-items: center; gap: 5px; padding-left: 6px; border-left: 1px solid var(--fv-border); }
        #fv-dbg-ctrl.hidden { display: none; }
        .fv-dbg-btn {
            flex: none; width: 26px; height: 24px; padding: 0; text-align: center; line-height: 22px;
            border: 1px solid var(--fv-border); border-radius: 4px; background: transparent;
            color: var(--fv-text); font-size: 13px; cursor: pointer; user-select: none;
        }
        .fv-dbg-btn:hover { background: var(--fv-hover); }
        .fv-dbg-btn:disabled { opacity: 0.45; cursor: default; }
        .fv-dbg-btn.hidden { display: none; }
        #fv-dbg-dot { flex: none; width: 8px; height: 8px; border-radius: 50%; background: #9e9e9e; }
        #fv-dbg-dot.starting, #fv-dbg-dot.running { background: #2da44e; }
        #fv-dbg-dot.paused { background: #e5b567; }
        #fv-dbg-dot.ended { background: #8a8a8a; }
        /* 底部调试面板（变量/调用堆栈/断点/控制台 四栏页签，TRAE CN 同款布局） */
        #fv-dbg-panel {
            flex: none; height: 240px; display: none; flex-direction: column;
            border-top: 1px solid var(--fv-border); background: var(--fv-panel);
        }
        #fv-dbg-panel.open { display: flex; }
        #fv-dbg-tabs {
            flex: none; display: flex; align-items: center; gap: 2px; padding: 0 8px;
            height: 30px; border-bottom: 1px solid var(--fv-border); user-select: none;
        }
        .fv-dbg-tab {
            padding: 0 12px; height: 100%; line-height: 30px; font-size: 12px;
            color: var(--fv-text-light); cursor: pointer;
            border-bottom: 2px solid transparent;
        }
        .fv-dbg-tab:hover { color: var(--fv-text); }
        .fv-dbg-tab.active { color: var(--fv-primary); border-bottom-color: var(--fv-primary); }
        #fv-dbp-spacer { flex: 1; }
        .fv-dbp-act { padding: 0 8px; font-size: 12px; color: var(--fv-text-light); cursor: pointer; line-height: 30px; }
        .fv-dbp-act:hover { color: var(--fv-text); }
        #fv-dbg-banner {
            flex: none; display: none; align-items: center; gap: 10px;
            margin: 6px 8px 0; padding: 6px 10px; border-radius: 6px;
            background: var(--fv-banner-bg); color: var(--fv-banner-fg); font-size: 12px;
        }
        #fv-dbg-banner.show { display: flex; }
        #fv-dbg-panes { flex: 1; min-height: 0; position: relative; }
        .fv-dbg-pane {
            position: absolute; inset: 0; overflow: auto; padding: 6px 4px;
            font: 12px/1.7 "JetBrains Mono IM", "Cascadia Code", Consolas, monospace;
        }
        .fv-dbg-pane.hidden { display: none; }
        .fv-dbg-pane::-webkit-scrollbar { width: 8px; height: 8px; }
        .fv-dbg-pane::-webkit-scrollbar-track { background: transparent; }
        .fv-dbg-pane::-webkit-scrollbar-thumb { background: var(--fv-scroll); border-radius: 4px; }
        .fv-dbg-pane::-webkit-scrollbar-thumb:hover { filter: brightness(0.85); }
        /* 变量树节点 */
        .fv-dbg-node { display: flex; align-items: baseline; gap: 6px; padding: 0 8px; white-space: pre; }
        .fv-dbg-node:hover { background: var(--fv-hover); }
        .fv-dbg-twist { flex: none; width: 14px; text-align: center; color: var(--fv-text-light); cursor: pointer; user-select: none; }
        .fv-dbg-twist.leaf { visibility: hidden; }
        .fv-dbg-name { color: #b392f0; }
        .fv-dbg-val { color: var(--fv-text); word-break: break-all; white-space: pre-wrap; }
        .fv-dbg-type { color: var(--fv-text-light); font-size: 11px; }
        /* 调用堆栈/断点行 */
        .fv-dbg-row { display: flex; align-items: center; gap: 8px; padding: 0 10px; cursor: pointer; }
        .fv-dbg-row:hover { background: var(--fv-hover); }
        .fv-dbg-row.active { background: var(--fv-quote-bg); }
        .fv-dbg-row .fn { color: var(--fv-text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .fv-dbg-row .loc { color: var(--fv-text-light); font-size: 11px; flex: none; }
        .fv-dbg-row .rm { flex: none; color: var(--fv-text-light); font-size: 13px; padding: 0 4px; border-radius: 3px; }
        .fv-dbg-row .rm:hover { color: #e5534b; background: rgba(207, 34, 46, 0.12); }
        /* 控制台输出 */
        #fv-dbg-out { white-space: pre-wrap; word-break: break-all; }
        #fv-dbg-out .err { color: #e5534b; }
        #fv-dbg-out .dbg { color: var(--fv-text-light); }
    </style>
</head>
<body>
    <div id="fv-bar">
        <span id="fv-name">（等待打开…）</span>

        <!-- 阶段一百五十九：调试控制条（TRAE CN 同款：状态灯 + 继续/单步/步入/步出/重启/停止；仅支持调试的语言显示） -->

            <button id="fv-dbg-next" class="fv-dbg-btn hidden" title="单步跳过 (F10)">↷</button>
            <button id="fv-dbg-stepin" class="fv-dbg-btn hidden" title="单步进入 (F11)">↴</button>
            <button id="fv-dbg-stepout" class="fv-dbg-btn hidden" title="单步跳出 (Shift+F11)">↰</button>
            <button id="fv-dbg-restart" class="fv-dbg-btn hidden" title="重启调试">⟳</button>

            <button id="fv-btn-diffscope" class="fv-btn hidden" title="在全文对比与仅显示变更之间切换">仅变更</button>
        </div>
        <div id="fv-diff"></div>
    </div>
    <div id="fv-monaco"></div>
    <!-- 阶段一百五十九：底部调试面板（变量/调用堆栈/断点/控制台；默认隐藏，启动调试或暂停时展开） -->
    <div id="fv-dbg-panel">
        <div id="fv-dbg-banner">
            <span id="fv-dbg-banner-text"></span>
            <button id="fv-dbg-banner-btn" class="fv-btn primary">一键安装</button>
        </div>
        <div id="fv-dbg-tabs">
            <span class="fv-dbg-tab active" data-pane="fv-dbg-vars">变量</span>
            <span class="fv-dbg-tab" data-pane="fv-dbg-stack">调用堆栈</span>
            <span class="fv-dbg-tab" data-pane="fv-dbg-bps">断点</span>
            <span class="fv-dbg-tab" data-pane="fv-dbg-out">控制台</span>
            <span id="fv-dbp-spacer"></span>
            <span id="fv-dbp-clear" class="fv-dbp-act" title="清空控制台">清空</span>
            <span id="fv-dbp-close" class="fv-dbp-act" title="收起面板">×</span>
        </div>
        <div id="fv-dbg-panes">
            <div id="fv-dbg-vars" class="fv-dbg-pane"><div class="fv-hint">未暂停（变量在程序暂停时展示）</div></div>
            <div id="fv-dbg-stack" class="fv-dbg-pane hidden"></div>
            <div id="fv-dbg-bps" class="fv-dbg-pane hidden"></div>
            <div id="fv-dbg-out" class="fv-dbg-pane hidden"></div>
        </div>
    </div>
    <!-- 阶段一百五十八：AI 修改说明悬停浮层（自绘无系统弹窗；默认隐藏，悬停行号旁变更色条时弹出） -->
    <div id="fv-ai-pop">
        <div class="fv-ai-pop-arrow" id="fv-ai-pop-arrow"></div>
        <div class="fv-ai-pop-head">
            <span class="fv-ai-badge b-mod" id="fv-ai-pop-badge">AI 修改</span>
            <span class="fv-ai-pop-stat" id="fv-ai-pop-stat"></span>
            <span class="fv-ai-pop-lines" id="fv-ai-pop-lines"></span>
        </div>
        <div class="fv-ai-pop-text" id="fv-ai-pop-text"></div>
        <div class="fv-ai-pop-foot">
            <button id="fv-ai-pop-revert" class="fv-btn hidden">回滚此文件</button>
        </div>
    </div>
    <script src="/lib/monaco/min/vs/loader.js"></script>
    <script>
    (function () {
        'use strict';
        var bodyEl = document.getElementById('fv-body');
        var nameEl = document.getElementById('fv-name');
        var statusEl = document.getElementById('fv-status');
        var btnEdit = document.getElementById('fv-btn-edit');
        var btnSave = document.getElementById('fv-btn-save');
        var btnCancel = document.getElementById('fv-btn-cancel');
        var diffWrap = document.getElementById('fv-diff-wrap');   // 阶段九十六：Monaco diff 对比视图
        var diffInfo = document.getElementById('fv-diff-info');
        var diffBox = document.getElementById('fv-diff');
        var btnDiffMode = document.getElementById('fv-btn-diffmode');
        var btnDiffScope = document.getElementById('fv-btn-diffscope'); // 全文/仅变更切换
        var diffEd = null;          // diff 编辑器实例（复用，不随渲染重建）
        var diffSide = true;        // true=并排 false=行内
        var diffFull = false;       // 默认仅变更（Monaco 折叠未变更区，展开条可还原）；点「全文」按钮切换
        var diffOrigModel = null, diffModModel = null; // 每次渲染重建并释放旧模型，防泄漏
        var btnKeep = document.getElementById('fv-btn-keep');   // 阶段九十七：任务变更保留/撤销
        var btnRevert = document.getElementById('fv-btn-revert');
        var previewLock = false;    // 主动取消后的预览锁（防"打开即编辑"回流，编辑按钮恢复）
        var dirtyNow = false;       // 编辑态脏标记（保存按钮显隐/状态栏驱动）
        var suppressDirty = false;  // monacoTakeOver setValue 期间屏蔽手工脏判定
        var fvBase = '';            // gutter 基线（任务文件=任务前内容；普通文件=最近保存内容）

        // ===== 阶段一百零七：主题跟随主程序（同源 localStorage im_theme：light/dark/system） =====
        // viewer 页与主页面同源（SERVER_URL 静态文件）共享 localStorage：主页面切主题时本页经
        // storage 事件实时跟随（BrowserView 与同源 iframe 均触发）；system 模式由媒体查询联动。
        // Monaco 就绪后同步切编辑器主题；代码块面深色恒定不入主题切换（豆包同款）。
        var fvSchemeQuery = window.matchMedia('(prefers-color-scheme: dark)');
        function fvThemeRaw() {
            var t = 'light';
            try { t = localStorage.getItem('im_theme') || 'light'; } catch (e) {}
            return t;
        }
        function fvThemeDark() {
            var t = fvThemeRaw();
            return t === 'dark' || (t === 'system' && fvSchemeQuery.matches);
        }
        function fvApplyTheme() {
            document.documentElement.setAttribute('data-theme', fvThemeRaw());
            if (monacoReady) { monaco.editor.setTheme(fvThemeDark() ? 'im-dark' : 'im-light'); }
        }
        fvApplyTheme();
        window.addEventListener('storage', function (e) { // 主页面切主题实时跟随（同源跨文档事件）
            if (!e || e.key === 'im_theme' || e.key === null) fvApplyTheme();
        });
        if (fvSchemeQuery.addEventListener) fvSchemeQuery.addEventListener('change', fvApplyTheme);
        else if (fvSchemeQuery.addListener) fvSchemeQuery.addListener(fvApplyTheme);

        // ===== 阶段一百一十：Monaco 右键菜单中文化（开源 Monaco 无中文语言包，内置菜单恒英文） =====
        // 思路：编辑器容器捕获阶段拦截 contextmenu（preventDefault+stopPropagation，Monaco 内置
        // 菜单与浏览器默认菜单都不会出现），改弹自绘中文菜单（.fv-ctx-menu，主题变量配色）。
        // 条目派发：EditorAction（如更改所有匹配项）走 editor.getAction().run()；剪切/复制/粘贴
        // 在本版本为 MultiCommand 编辑器命令，须走 editor.trigger()（见 fvAttachCtxMenu 内注释）；
        // 只读 diff 对比视图仅保留复制/全选，剪切/粘贴对只读编辑器无意义
        var fvCtxMenuEl = null;
        function fvCloseCtxMenu() {
            if (!fvCtxMenuEl) return;
            fvCtxMenuEl.remove();
            fvCtxMenuEl = null;
            document.removeEventListener('mousedown', fvCtxOutside, true);
            document.removeEventListener('keydown', fvCtxEsc, true);
            window.removeEventListener('blur', fvCloseCtxMenu);
        }
        function fvCtxOutside(e) {
            if (fvCtxMenuEl && !fvCtxMenuEl.contains(e.target)) fvCloseCtxMenu();
        }
        function fvCtxEsc(e) { if (e.key === 'Escape') fvCloseCtxMenu(); }
        function fvShowCtxMenu(x, y, items) {
            fvCloseCtxMenu();
            var menu = document.createElement('div');
            menu.className = 'fv-ctx-menu';
            items.forEach(function (it) {
                if (it.sep) {
                    var s = document.createElement('div');
                    s.className = 'fv-ctx-sep';
                    menu.appendChild(s);
                    return;
                }
                var row = document.createElement('div');
                row.className = 'fv-ctx-item';
                var t = document.createElement('span');
                t.textContent = it.label;
                row.appendChild(t);
                if (it.key) {
                    var k = document.createElement('span');
                    k.className = 'fv-ctx-key';
                    k.textContent = it.key;
                    row.appendChild(k);
                }
                row.addEventListener('click', function () {
                    fvCloseCtxMenu();
                    try { it.run(); } catch (e) {}
                });
                menu.appendChild(row);
            });
            document.body.appendChild(menu);
            // 右/下缘防溢出翻转（与主程序自绘菜单同口径）
            var r = menu.getBoundingClientRect();
            menu.style.left = Math.max(8, Math.min(x, window.innerWidth - r.width - 8)) + 'px';
            menu.style.top = Math.max(8, Math.min(y, window.innerHeight - r.height - 8)) + 'px';
            fvCtxMenuEl = menu;
            setTimeout(function () { // 异步挂全局关闭（避开本次右键事件冒泡）
                document.addEventListener('mousedown', fvCtxOutside, true);
                document.addEventListener('keydown', fvCtxEsc, true);
                window.addEventListener('blur', fvCloseCtxMenu);
            }, 0);
        }
        // fvAttachCtxMenu 给编辑器挂中文右键菜单：domOwner 提供容器 DOM（普通编辑器传编辑器实例
        // 自带 getDomNode；diff 编辑器实例不暴露 getDomNode，直接传容器 #fv-diff），
        // actEditor 提供命令来源（diff 需用 getModifiedEditor 取内部编辑器）
        function fvAttachCtxMenu(domOwner, actEditor, readonly) {
            var dom = (typeof domOwner.getDomNode === 'function') ? domOwner.getDomNode() : domOwner;
            if (!dom || dom.__fvCtxHooked) return;
            dom.__fvCtxHooked = true;
            dom.addEventListener('contextmenu', function (e) {
                e.preventDefault();
                e.stopPropagation();
                var act = function (id) {
                    try { return actEditor.getAction(id); } catch (err) { return null; }
                };
                // 本版本 Monaco 的剪切/复制/粘贴为 MultiCommand（编辑器命令，非 EditorAction），
                // getAction 取不到（返回 null），须经 editor.trigger 派发（与键位绑定同路径，实测可用）
                var cmd = function (id) {
                    return function () { try { actEditor.trigger('fv-ctx-menu', id, null); } catch (e) {} };
                };
                var changeAll = readonly ? null : act('editor.action.changeAll');
                // 注：不提供"命令面板"条目——Monaco QuickAccess 面板本身全英文且无法本地化，
                // 点开反而又冒英文 UI（快捷键 F1 仍可用）
                var items = [];
                if (changeAll) items.push({ label: '更改所有匹配项', key: 'Ctrl+F2', run: function () { changeAll.run(); } });
                if (items.length) items.push({ sep: true });
                if (!readonly) items.push({ label: '剪切', key: 'Ctrl+X', run: cmd('editor.action.clipboardCutAction') });
                items.push({ label: '复制', key: 'Ctrl+C', run: cmd('editor.action.clipboardCopyAction') });
                if (!readonly) items.push({ label: '粘贴', key: 'Ctrl+V', run: cmd('editor.action.clipboardPasteAction') });
                items.push({ sep: true });
                items.push({ label: '全选', key: 'Ctrl+A', run: function () {
                    var m = actEditor.getModel();
                    if (m) { actEditor.setSelection(m.getFullModelRange()); actEditor.focus(); }
                } });
                fvShowCtxMenu(e.clientX, e.clientY, items);
            }, true); // 捕获阶段：先于 Monaco 内置 contextmenu 处理器（bubble），拦下即不再弹英文菜单
        }

        // ===== 阶段一百一十：TRAE CN 同款代码符号面包屑 =====
        // Monaco 独立版仅 TS/JS/HTML/CSS/JSON 内置符号提供者，C++/Go/Rust 等没有；此处自扫
        // （逐行轻量正则，全语言通用，行号与编辑器行号一致，导航用途足够）。结果经
        // viewerBridge().reportSymbols 推给宿主页渲染面包屑符号段，点击经 __fvReveal 跳回编辑器。
        // 树形层级：C系按花括号深度、Python 按缩进推导父子关系（depth/hasKids 供菜单折叠展开）
        function fvScanSymbols(text, ext) {
            var out = [];
            if (!text) return out;
            var lines = String(text).split('\n');
            var py = (ext || '').toLowerCase() === 'py';
            // 控制流关键字不作函数名（if/for/while 等带 ( 的行不是声明）
            var ctl = /^(if|for|while|switch|catch|return|else|do|elif|try|finally|with|foreach|using|lock|throw)$/;
            // 未闭合祖先符号栈：新符号 scope 更小或同级则逐层弹出，栈顶即父符号
            var stack = [];
            var d = 0; // 花括号深度（C系）
            function pushSym(name, kind, line, scope) {
                var s = { name: name, kind: kind, line: line, depth: 0, hasKids: false, scope: scope };
                while (stack.length && stack[stack.length - 1].scope >= scope) stack.pop();

                    return '<a href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
                });
        }
        function renderMarkdown(src) {
            var lines = String(src || '').replace(/\r\n/g, '\n').split('\n');
            var html = [], i = 0, inCode = false, codeBuf = [], codeLang = '';
            var listStack = null; // 'ul' | 'ol'
            function closeList() { if (listStack) { html.push('</' + listStack + '>'); listStack = null; } }
            for (i = 0; i < lines.length; i++) {
                var line = lines[i];
                var fence = line.match(/^```\s*([A-Za-z0-9+#-]*)\s*$/);
                if (fence) {
                    if (inCode) {
                        var body = codeBuf.join('\n');
                        var lang = codeLang && window.hljs && window.hljs.getLanguage(codeLang) ? codeLang : '';
                        var hi = '';
                        try { hi = lang ? window.hljs.highlight(body, { language: lang, ignoreIllegals: true }).value : window.hljs.highlightAuto(body).value; }
                        catch (e) { hi = esc(body); }
                        html.push('<pre class="fv-md-code"><code class="hljs">' + hi + '</code></pre>');
                        inCode = false; codeBuf = []; codeLang = '';
                    } else {
                        closeList(); inCode = true; codeLang = fence[1] || '';
                    }
                    continue;
                }
                if (inCode) { codeBuf.push(line); continue; }
                if (!line.trim()) { closeList(); continue; }
                var h = line.match(/^(#{1,6})\s+(.*)$/);
                if (h) { closeList(); html.push('<h' + h[1].length + '>' + renderMarkdownInline(h[2]) + '</h' + h[1].length + '>'); continue; }
                if (/^(---+|\*\*\*+|___+)\s*$/.test(line)) { closeList(); html.push('<hr>'); continue; }
                var q = line.match(/^>\s?(.*)$/);
                if (q) { closeList(); html.push('<blockquote>' + renderMarkdownInline(q[1]) + '</blockquote>'); continue; }
                // 表格：当前行含 | 且下一行是分隔行
                if (line.indexOf('|') >= 0 && i + 1 < lines.length && /^\s*\|?[\s:|-]+\|[\s:|-]*$/.test(lines[i + 1])) {
                    closeList();
                    var head = line.replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|');
                    var rows = [];
                    var j = i + 2;
                    while (j < lines.length && lines[j].indexOf('|') >= 0 && lines[j].trim()) {
                        rows.push(lines[j].replace(/^\s*\|/, '').replace(/\|\s*$/, '').split('|'));
                        j++;
                    }
                    i = j - 1;
                    var th = head.map(function (c) { return '<th>' + renderMarkdownInline(c.trim()) + '</th>'; }).join('');
                    html.push('<table><thead><tr>' + th + '</tr></thead><tbody>' +
                        rows.map(function (r) { return '<tr>' + r.map(function (c) { return '<td>' + renderMarkdownInline(c.trim()) + '</td>'; }).join('') + '</tr>'; }).join('') +
                        '</tbody></table>');
                    continue;
                }
                var ul = line.match(/^\s*[-*+]\s+(.*)$/);
                var ol = line.match(/^\s*\d+[.)]\s+(.*)$/);
                if (ul || ol) {
                    var want = ul ? 'ul' : 'ol';
                    if (listStack !== want) { closeList(); html.push('<' + want + '>'); listStack = want; }
                    html.push('<li>' + renderMarkdownInline((ul || ol)[1]) + '</li>');
                    continue;
                }
                closeList();
                html.push('<p>' + renderMarkdownInline(line) + '</p>');
            }
            if (inCode && codeBuf.length) html.push('<pre class="fv-md-code"><code class="hljs">' + esc(codeBuf.join('\n')) + '</code></pre>');
            closeList();
            return html.join('');
        }

        // ===== diff 对比视图（阶段九十六：Monaco diff 编辑器增强）=====

        function renderDiffStatic(text) {
            var wrap = document.createElement('div');
            wrap.className = 'fv-code-wrap';

            var ln = document.createElement('div');
            ln.className = 'fv-code-ln';

            for (var i = 1; i <= lines.length; i++) lnText += i + '\n';
            ln.textContent = lnText;

            var code = document.createElement('code');
            var done = false;

                try { code.innerHTML = window.hljs.highlight(text, { language: 'diff', ignoreIllegals: true }).value; done = true; } catch (e) { done = false; }
            }

        // parseUnifiedDiff：把 git unified diff 还原为 original/modified 双文本。
        // 规则：hunk 外（diff --git/index/---/+++ 等）与 @@ 行两侧共有，保持多文件/多 hunk 对齐；
        // hunk 内 '-' 进 original、'+' 进 modified、' ' 两侧共有、'\'（No newline）为非内容行忽略。
        function parseUnifiedDiff(text) {
            var orig = [], mod = [], binary = false, inHunk = false;
            var lines = (text || '').replace(/\r\n/g, '\n').split('\n');
            for (var i = 0; i < lines.length; i++) {
                var L = lines[i];
                if (inHunk) {
                    if (L.indexOf('@@') === 0) { orig.push(L); mod.push(L); continue; } // 下一 hunk
                    var c = L.charAt(0);
                    if (c === '\\') continue;
                    if (c === '+') mod.push(L.slice(1));
                    else if (c === '-') orig.push(L.slice(1));
                    else { orig.push(L); mod.push(L); } // 上下文行
                    continue;
                }
                if (L.indexOf('@@') === 0) { inHunk = true; orig.push(L); mod.push(L); continue; }
                if (L.charAt(0) === '\\') continue;
                if (L.indexOf('Binary files ') === 0 || L.indexOf('GIT binary patch') === 0) binary = true;
                orig.push(L); mod.push(L); // 文件头/元信息行：两侧共有
            }
            return { original: orig.join('\n'), modified: mod.join('\n'), binary: binary };
        }
        // diffExtOf：优先 meta.path 扩展名，否则取 diff 文本最后一个 +++ b/xx 目标路径的扩展名（决定对比器内语法高亮语言）
        function diffExtOf(p, text) {
            var path = (p.meta && p.meta.path) || '';
            var m = /\.([A-Za-z0-9_]+)\s*$/.exec(path);
            if (m) return m[1].toLowerCase();
            var lines = text.split('\n');
            for (var i = lines.length - 1; i >= 0; i--) {
                if (lines[i].indexOf('+++ ') === 0) {
                    var mm = /\.([A-Za-z0-9_]+)\s*$/.exec(lines[i].slice(4));
                    if (mm) return mm[1].toLowerCase();
                }
            }
            return '';
        }
        function diffHeaderInfo(p) { // 头部信息条：commit 元信息或文件路径
            diffInfo.innerHTML = '';
            if (p.kind === 'commit' && p.meta) {
                if (p.meta.msg) {
                    var s = document.createElement('div');
                    s.className = 'fv-commit-subject';
                    s.textContent = p.meta.msg;
                    diffInfo.appendChild(s);
                }
                var info = [p.meta.an, p.meta.at ? new Date(p.meta.at).toLocaleString('zh-CN') : '', p.meta.sh]
                    .filter(function (x) { return x; }).join(' · ');
                if (info) {
                    var d = document.createElement('div');
                    d.className = 'fv-commit-info';
                    d.textContent = info;
                    diffInfo.appendChild(d);
                }
            } else if (p.meta && p.meta.path) {
                diffInfo.textContent = '文件：' + p.meta.path;
                // 阶段一百五十八：AI 说明行 + 统计徽标（变更审查条点击进入 diff 预览时经 meta 透传，无则不建节点）
                var ex = p.meta.expl;
                if (ex && (ex.text || ex.adds || ex.dels)) {
                    var row = document.createElement('div');
                    row.className = 'fv-diff-expl';
                    var b = document.createElement('span');
                    b.className = 'fv-ai-badge ' + (ex.kind === 'create' ? 'b-add' : 'b-mod');
                    b.textContent = 'AI';
                    row.appendChild(b);
                    if (ex.text) {
                        var tx = document.createElement('span');
                        tx.className = 'fv-expl-text';
                        tx.textContent = ex.text;
                        tx.title = ex.text;
                        row.appendChild(tx);
                    }
                    if (ex.adds || ex.dels) {
                        var stt = document.createElement('span');
                        stt.className = 'fv-diff-stat';
                        var sa = document.createElement('span'); sa.className = 'fv-add'; sa.textContent = '+' + (ex.adds || 0);
                        var sd = document.createElement('span'); sd.className = 'fv-del'; sd.textContent = '-' + (ex.dels || 0);
                        stt.appendChild(sa); stt.appendChild(sd);
                        row.appendChild(stt);
                    }
                    diffInfo.appendChild(row);
                }
            }
        }
        function renderDiffView(p) { // diff/commit 渲染入口（bodyEl 隐藏，diff 视图接管）
            bodyEl.style.display = 'none';

            btnDiffMode.classList.remove('hidden');
            btnDiffScope.classList.remove('hidden');
            diffHeaderInfo(p);
            if (!monacoReady) { // 复用编辑态同一条懒加载通道，就绪后自动渲染
                if (monacoDead) { // 阶段一百：编辑器加载失败过 → 直接静态渲染兜底，不再循环重试
                    renderDiffStatic(p.content || '');

                }
                setStatus('对比器加载中…');
                monacoPendingCb = function () { if (diffWrap.style.display !== 'none') renderDiffApply(data); };
                fvAsyncRender = true; // 阶段一百三十一：对比器懒加载为异步通道，完成由 monacoBoot/失败兜底回执
                ensureMonaco();
                return;
            }

        }
        function renderDiffApply(p) {
            setStatus('只读');
            var text = p.content || '';
            var fallback = function () { // 兜底：恢复 bodyEl + 静态渲染
                diffWrap.style.display = 'none';
                btnDiffMode.classList.add('hidden');
                btnDiffScope.classList.add('hidden');
                bodyEl.style.display = '';
                renderDiffStatic(text);
            };
            if (!text) { fallback(); return; } // 无差异：静态提示条最直观
            var parsed = parseUnifiedDiff(text);
            if (parsed.binary || (!parsed.original && !parsed.modified)) { fallback(); return; } // 二进制差异/非 unified 格式
            var lang = MONACO_LANG[diffExtOf(p, text)] || 'plaintext';

                    readOnlyMessage: { value: '对比视图为只读，如需修改请打开对应文件标签编辑' },
                    originalEditable: false,

                    fontFamily: '"JetBrains Mono IM", "Cascadia Code", Consolas, "Courier New", monospace',

                    diffWordWrap: 'off',

                    // 首个渲染的同值 updateOptions 是 no-op，区域计算已在无模型时跑过且不再触发（实测不折叠）。

                    hideUnchangedRegions: { enabled: false },

                // 点第二次才出内容——实测定位）。挂容器上左右两栏右键均为中文菜单
                fvAttachCtxMenu(diffBox, diffEd.getModifiedEditor(), true); // 阶段一百一十：diff 只读右键（复制/全选）
            }
            if (diffOrigModel) diffOrigModel.dispose();
            if (diffModModel) diffModModel.dispose();
            diffOrigModel = monaco.editor.createModel(parsed.original, lang);
            diffModModel = monaco.editor.createModel(parsed.modified, lang);
            diffEd.setModel({ original: diffOrigModel, modified: diffModModel });
            // 本版 Monaco 创建参数里的 hideUnchangedRegions 首开不生效（实测），模型设置后
            // updateOptions 才可靠（v=118 动态切换实测有效）——每次渲染后按当前模式重申一次。
            // 无差异（两侧全等，如放弃修改后的伪 diff 全上下文）强制全文：仅变更模式下
            // 全文件都是未变更区会被整体折叠成一条展开条，反而什么都看不到
            diffEd.updateOptions({ hideUnchangedRegions: { enabled: !diffFull && parsed.original !== parsed.modified, contextLineCount: 3 } });
            // 阶段一百一十六：diff 符号面包屑——扫工作树侧（modified），行号与右栏一致，
            // 宿主页地址栏显示 文件名 › ƒ函数（点击经 __fvReveal 跳 diff 右栏对应行，与文件浏览同款）
            try { viewerBridge().reportSymbols(data.tab_id, fvScanSymbols(parsed.modified, diffExtOf(p, text))); } catch (e) {}
            btnDiffMode.textContent = diffSide ? '行内对比' : '并排对比';
            btnDiffScope.textContent = diffFull ? '仅变更' : '全文'; // 按钮文案=点击后的目标视图（与 diffmode 同款语义）
        }
        btnDiffMode.addEventListener('click', function () { // 并排/行内切换（TRAE CN 同款）

                if (r && r.ok && r.lines && r.lines.length) {
                    dbg.bps = r.lines.slice().sort(function (a, b) { return a - b; });
                    dbgRenderBps(); dbgRenderBpsPane();
                }
            }).catch(function () {});
            api.debugState(data.tab_id).then(function (r) {
                if (r && r.active) { // 会话存活（payload 重推/重登刷新场景）：恢复控制条与暂停态
                    dbg.status = r.status || 'running';
                    if (r.breakpoints && r.breakpoints.length) {
                        dbg.bps = r.breakpoints.slice().sort(function (a, b) { return a - b; });
                        dbgRenderBps(); dbgRenderBpsPane();
                    }
                    dbgUpdateBar();
                    if (dbg.status === 'paused') dbgPauseRefresh();
                    else dbgOpenPanel(false);
                }
            }).catch(function () {});
        }
        window.__wsDebugEvent = function (d) { // 主进程 debug:event 入口（宿主 chat.js 按 tab_id 转发）
            if (!d) return;
            switch (d.type) {
                case 'status':
                    dbg.status = d.status || '';
                    dbgUpdateBar();
                    break;
                case 'stopped':
                    dbg.status = 'paused';
                    dbg.threadId = d.threadId || 0;
                    dbgAppendOut('dbg', '已暂停' + (d.reason === 'breakpoint' ? '于断点' : d.reason === 'step' ? '（单步）' : d.reason === 'pause' ? '（手动暂停）' : '') + '\n');
                    dbgPauseRefresh();
                    break;
                case 'continued':
                    dbg.status = 'running';
                    dbgClearPause(); dbgUpdateBar(); dbgSetVarsHint('运行中…');
                    break;
                case 'output':
                    dbgAppendOut(d.category || 'stdout', d.text || '');
                    break;
                case 'terminated':
                    dbg.status = 'ended';
                    dbgClearPause(); dbgUpdateBar(); dbgSetVarsHint('调试已结束');
                    dbgAppendOut('dbg', '调试会话已结束\n');
                    break;
                case 'breakpoints':
                    if (d.lines) {
                        dbg.bps = d.lines.slice().sort(function (a, b) { return a - b; });
                        dbgRenderBps(); dbgRenderBpsPane();
                    }
                    break;
            }
        };
        (function dbgInit() { // 一次性事件绑定
            dbgEl.start.addEventListener('click', dbgStart);
            dbgEl.cont.addEventListener('click', function () { dbgStep('continue'); });
            dbgEl.pause.addEventListener('click', function () { dbgStep('pause'); });
            dbgEl.next.addEventListener('click', function () { dbgStep('next'); });
            dbgEl.stepin.addEventListener('click', function () { dbgStep('stepIn'); });
            dbgEl.stepout.addEventListener('click', function () { dbgStep('stepOut'); });
            dbgEl.restart.addEventListener('click', dbgRestart);
            dbgEl.stop.addEventListener('click', dbgStop);
            dbgEl.close.addEventListener('click', dbgClosePanel);
            dbgEl.clear.addEventListener('click', function () { dbgEl.out.innerHTML = ''; });
            dbgEl.bannerBtn.addEventListener('click', dbgBootstrap);
            var tabs = dbgEl.panel.querySelectorAll('.fv-dbg-tab');
            for (var i = 0; i < tabs.length; i++) {
                (function (t) {
                    t.addEventListener('click', function () { dbgSwitchPane(t.getAttribute('data-pane')); });
                })(tabs[i]);
            }
        })();

        // ===== 主渲染入口 =====
        function render() {
            bodyEl.innerHTML = '';
            monacoBox.style.display = 'none';
            diffWrap.style.display = 'none';
            btnDiffMode.classList.add('hidden');
            btnDiffScope.classList.add('hidden');
            bodyEl.style.display = '';
            btnEdit.classList.add('hidden');
            btnSave.classList.add('hidden');
            btnKeep.classList.add('hidden');
            btnRevert.classList.add('hidden');
            btnCancel.classList.add('hidden');
            if (!data) { nameEl.textContent = '（未打开）'; setStatus(''); return; }
            nameEl.textContent = data.title || data.name || '';
            var p = data;

            if (p.kind === 'md') { // 审查报告等：md 只读渲染
                setStatus('只读');
                var md = document.createElement('div');
                md.className = 'fv-md';
                md.innerHTML = renderMarkdown(p.content);
                bodyEl.appendChild(md);
                return;
            }
            if (p.kind === 'diff' || p.kind === 'commit') { // 阶段九十六：Monaco diff 对比视图（含静态兜底）
                renderDiffView(p);
                return;
            }
            // kind === 'file'
            if (p.mime === 'binary') {
                var buf = b64ToBuf(p.b64);
                if (p.ext === 'docx' || p.ext === 'docm') { setStatus('Word 文档预览（只读）'); renderDocx(buf); return; }
                if (p.ext === 'xlsx' || p.ext === 'xlsm') { setStatus('Excel 表格预览（只读）'); renderXlsx(buf); return; }
                if (p.ext === 'pptx' || p.ext === 'pptm') { setStatus('PPT 幻灯片预览（只读）'); renderPptx(buf); return; }
                if (IMG_TYPES[p.ext]) { setStatus('图片预览（只读）'); renderBinaryMedia(p.b64, p.ext); return; }
                if (p.ext === 'pdf') { setStatus('PDF 预览（只读）'); renderBinaryMedia(p.b64, 'pdf'); return; }
                setStatus('二进制文件（不支持预览）');
                bodyEl.innerHTML = '<div class="fv-hint">该文件为二进制格式（.' + esc(p.ext) + '），暂不支持在线预览。</div>';
                return;
            }
            // 文本类：可编辑 → 编辑按钮；截断 → 只读提示条
            if (p.truncated) {
                var ban = document.createElement('div');
                ban.className = 'fv-banner';
                ban.textContent = '文件过大，仅显示前 512KB（只读）';
                bodyEl.appendChild(ban);
            }
            if (!editing) {
                if (p.ext === 'md' || p.ext === 'markdown') { // 阶段九十四修复：MD 恢复渲染预览——renderMarkdown 完整存在但文本类统一 renderCode 时分流被删，成了死代码
                    var mdWrap = document.createElement('div');
                    mdWrap.className = 'fv-md';
                    mdWrap.innerHTML = renderMarkdown(p.content || '');
                    bodyEl.appendChild(mdWrap);
                } else {
                    bodyEl.appendChild(renderCode(p.content || '', p.ext || ''));
                }
            }
            fvPushSymbolsSoon(); // 阶段一百一十：文本内容就绪 → 扫描符号推送宿主页面包屑（防抖）
            var isMdFile = (p.ext === 'md' || p.ext === 'markdown');
            if (p.editable && hasViewer()) {
                if (isMdFile) { // MD 保持现状：预览 + 手动编辑按钮
                    btnEdit.classList.remove('hidden');
                    if (editing) showEditor();
                } else if (!editing && !previewLock && !monacoDead) { // 阶段九十七：源码文件打开即编辑（免点"编辑"，TRAE CN 同款）；monacoDead 时跳过自动编辑走下方预览+编辑按钮兜底
                    editing = true;
                    draft = '';
                    showEditor();
                } else if (editing) {
                    showEditor();
                } else { // previewLock：主动取消后保持预览态，编辑按钮恢复
                    btnEdit.classList.remove('hidden');
                }
            }
            if (editing) { // 编辑态：dirty 优先，任务修改次之（有 AI 说明时缩短为"AI 已修改"，悬停顶栏看全文）
                statusEl.title = (!dirtyNow && p.task_modified && p.explanation) ? p.explanation : '';
                setStatus(dirtyNow ? '已修改（未保存）' : (p.task_modified ? (p.explanation ? 'AI 已修改' : '任务已修改，可保留或撤销') : ''), (dirtyNow || p.task_modified) ? 'dirty' : '');
            } else if (p.editable) {
                statusEl.title = (p.task_modified && p.explanation) ? p.explanation : '';
                setStatus(p.task_modified ? (p.explanation ? 'AI 已修改' : '任务已修改，可保留或撤销') : '', p.task_modified ? 'dirty' : '');
            } else {
                statusEl.title = '';
                setStatus('只读', '');
            }
            updateTaskButtons(); // 预览/编辑态统一收口（预览态任务文件也可保留/撤销）
            dbgUpdateBar(); // 阶段一百五十九：调试控制条显隐随 payload（语言/桥/会话状态归口）
        }

        // ===== 编辑态 =====
        function showEditor() {
            bodyEl.style.display = 'none';
            var val = draft || (data && data.content) || '';
            // gutter 基线：任务文件=任务前备份内容（打开即见 AI 改动红蓝绿），否则=最近保存内容
            fvBase = (data && data.task_modified && data.baseline != null) ? data.baseline : ((data && data.__saved != null) ? data.__saved : ((data && data.content) || ''));
            dirtyNow = false;
            if (monacoReady) {
                monacoTakeOver(val);
                setStatus(''); // setValue 会触发一次内容变更提示，重置（render 尾部按 dirty/任务标记落最终状态）
            } else {
                monacoBox.style.display = 'block';
                setStatus('编辑器加载中…');
                monacoPendingCb = function () { if (editing && monacoBox.style.display === 'block') { monacoTakeOver(draft || (data && data.content) || ''); setStatus(''); } };
                fvAsyncRender = true; // 阶段一百三十一：Monaco 懒加载为异步通道，完成由 monacoBoot/失败兜底回执
                ensureMonaco(); // 首次进入编辑才加载 Monaco（本地资源毫秒级），加载完成自动接管
            }
            btnEdit.classList.add('hidden');
            btnSave.classList.add('hidden'); // 阶段九十七：dirty 才显示保存按钮
            btnCancel.classList.remove('hidden');
            updateTaskButtons();
        }
        function updateTaskButtons() { // 任务修改按钮：任务文件 + 未 dirty 即显示（预览/编辑态均可保留或撤销；dirty 后由保存接管）
            var show = !!(data && data.task_modified && hasViewer() && !dirtyNow);
            btnKeep.classList.toggle('hidden', !show);
            btnRevert.classList.toggle('hidden', !show);
        }
        btnEdit.addEventListener('click', function () {
            if (!data || !data.editable || editing) return;
            editing = true;
            previewLock = false; // 手动再进编辑（取消后的预览锁解除）
            monacoDead = false;  // 阶段一百：手动重试即重置失败标记（monacoDead 时 ensureMonaco 拒绝加载）
            draft = '';
            render(); // monacoTakeOver 内部会 focus；Monaco 未就绪时接管完成后自动 focus
        });
        btnCancel.addEventListener('click', function () {
            editing = false;
            previewLock = true; // 阶段九十七：主动取消后保持预览态（防"打开即编辑"回流），编辑按钮恢复
            draft = '';
            dirtyNow = false;
            if (data) data.content = data.__saved != null ? data.__saved : data.content; // 取消：回到已保存内容
            if (hasViewer() && data) viewerBridge().setDirty(data.tab_id, false);
            render();
        });
        // ===== 阶段一百一十一：变更导航按钮（‹ › 循环跳转变更块，居中定位） =====
        document.getElementById('fv-nav-prev').addEventListener('click', function () { taskNavGo(-1); });
        document.getElementById('fv-nav-next').addEventListener('click', function () { taskNavGo(1); });
        // ===== 阶段九十七：任务变更保留/撤销（TRAE CN 同款语义） =====
        btnKeep.addEventListener('click', function () {
            if (!data || !data.task_modified || !hasViewer()) return;
            btnKeep.disabled = true;
            viewerBridge().taskKeep(data.tab_id).then(function (r) {
                btnKeep.disabled = false;
                if (r && r.ok) { // 保留：接受当前磁盘内容（含 AI 改动），主进程已清备份
                    data.task_modified = false;
                    delete data.baseline;
                    fvBase = (data.__saved != null) ? data.__saved : (data.content || '');
                    updateTaskButtons();
                    setStatus('已保留任务变更', 'saved');
                    setTimeout(function () { if (statusEl.textContent === '已保留任务变更') setStatus('', ''); }, 2000);
                } else {
                    setStatus('保留失败：' + ((r && r.error) || '未知错误'), 'dirty');
                }
            }).catch(function (e) {
                btnKeep.disabled = false;
                setStatus('保留失败：' + (e && e.message || e), 'dirty');
            });
        });
        // ===== 阶段一百五十八：撤销任务变更公共流程（顶栏按钮与悬停浮层共用 armed 二次确认）=====
        var revertArmed = false, revertArmTimer = null;
        function fvRevertReset() { // 复位确认态（顶栏与浮层按钮同步恢复文案）
            revertArmed = false;
            if (revertArmTimer) { clearTimeout(revertArmTimer); revertArmTimer = null; }
            btnRevert.textContent = '撤销变更';
            btnRevert.classList.remove('danger');
            aiPopRevert.textContent = '回滚此文件';
            aiPopRevert.classList.remove('danger');
        }
        // fromPop=浮层按钮元素（顶栏撤销传 null）；二次确认 3 秒未确认自动复位防误触
        function fvTaskRevertFlow(fromPop) {
            if (!data || !data.task_modified || !hasViewer()) return;
            if (fromPop && dirtyNow) { setStatus('请先保存或撤销未保存编辑', 'dirty'); return; } // 浮层入口：dirty 由保存接管
            if (!revertArmed) {
                revertArmed = true;
                btnRevert.textContent = '确认撤销？';
                btnRevert.classList.add('danger');
                if (fromPop) { fromPop.textContent = '确认回滚？'; fromPop.classList.add('danger'); }
                revertArmTimer = setTimeout(fvRevertReset, 3000);
                return;
            }
            fvRevertReset();
            btnRevert.disabled = true;
            if (fromPop) fromPop.disabled = true;
            draft = ''; // 撤销即丢弃未保存编辑与任务改动，主进程重读盘重注入后回到任务前内容
            viewerBridge().taskRevert(data.tab_id).then(function (r) {
                btnRevert.disabled = false;
                if (fromPop) fromPop.disabled = false;
                fvAiPopHide(); // 回滚发起即收浮层（payload 重推后全量刷新）
                if (r && r.ok) { /* 主进程重读盘并重注入 payload → __wsFileLoad 全量刷新 */ }
                else setStatus('撤销失败：' + ((r && r.error) || '未知错误'), 'dirty');
            }).catch(function (e) {
                btnRevert.disabled = false;
                if (fromPop) fromPop.disabled = false;
                setStatus('撤销失败：' + (e && e.message || e), 'dirty');
            });
        }
        btnRevert.addEventListener('click', function () { fvTaskRevertFlow(null); });
        function doSave() {
            if (!data || !hasViewer()) return;
            var content = (monacoReady && monacoBox.style.display === 'block') ? monacoEditor.getValue() : (draft || (data && data.content) || '');
            btnSave.disabled = true;
            viewerBridge().save(data.tab_id, content).then(function (r) {
                btnSave.disabled = false;
                if (r && r.ok) {
                    editing = false;
                    draft = '';
                    data.__saved = content;
                    data.content = content;
                    if (data.task_modified) { data.task_modified = false; delete data.baseline; } // 阶段九十七：保存=保留全部改动（主进程已清任务备份）
                    fvBase = content; // gutter 基线对齐已保存内容
                    viewerBridge().setDirty(data.tab_id, false);
                    render();
                    setStatus('已保存', 'saved');
                    setTimeout(function () { if (statusEl.textContent === '已保存') setStatus(data.editable ? '' : '只读', ''); }, 2000);
                } else {
                    setStatus('保存失败：' + ((r && r.error) || '未知错误'), 'dirty');
                }
            }).catch(function (e) {
                btnSave.disabled = false;
                setStatus('保存失败：' + (e && e.message || e), 'dirty');
            });
        }
        btnSave.addEventListener('click', doSave);

        // ===== 注入入口（主进程 executeJavaScript 调用；双重 stringify 后 JSON.parse） =====
        window.__wsFileLoad = function (jsonStr) {
            try { data = JSON.parse(jsonStr); } catch (e) { data = null; }
            editing = false;
            draft = '';
            previewLock = false; // 阶段九十七：新 payload 注入重置预览锁（重开文件自动进编辑态）
            fvApplyTheme(); // 阶段一百零七：注入时同步主题（storage 事件兜底，防跨 BrowserView 边界丢事件）
            document.title = data ? (data.name || data.title || '文件预览') : '文件预览';
            fvLoadSeq++;           // 阶段一百三十一：新注入序号递增（过期异步回执以此判定丢弃）
            fvAsyncRender = false; // 每次注入重置异步通道标记（render 内走异步会置 true）
            render();
            // 阶段一百五十九：调试状态同步（断点持久化恢复 + 会话存活恢复；仅 PC 桥存在时生效）
            try { dbgOnPayload(); } catch (e) { /* 桥异常不影响渲染 */ }
            // 阶段一百三十一修复：同步渲染 render 返回即回执（DOM 已应用=页面打开完成，符合"只检测页面是否完整打开"）。
            // 原双 rAF 等首绘依赖窗口实际绘制——窗口被遮挡/最小化时 rAF 冻结回执丢失，条卡到看门狗；立即上报彻底解耦绘制
            if (!fvAsyncRender) fvLoaded(fvLoadSeq); // 异步通道（Monaco 懒加载/docx/pptx）由各异步完成点自行上报
        };
    })();
    </script>
</body>
</html>

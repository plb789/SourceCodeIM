<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>文档预览</title>
    <!-- 阶段四十六：免费纯前端文档预览页（iframe 内运行，与主应用样式/全局变量完全隔离）
         docx → docx-preview.js（开源 MIT，依赖 JSZip v3）
         xlsx → SheetJS（开源 Apache-2.0）逐 Sheet 转 HTML 表格
         查询参数：?type=docx|xlsx&url=文档地址（支持相对路径与 blob: 地址） -->
    <script src="js/lib/jszip.min.js?v=1.0"></script>
    <script src="js/lib/docx-preview.min.js?v=1.0"></script>
    <script src="js/lib/xlsx.full.min.js?v=1.0"></script>
    <!-- 阶段二百二十一：pdf.js（本地化）——Android WebView 无内置 PDF 查看器，手机端预览逐页渲染 -->
    <script src="js/lib/pdf.min.js?v=1.0"></script>
    <style>
        /* 页面基础：白底文档阅读场景（预览内容与文档实际打印观感一致，不随主应用深色主题变化） */
        html, body { margin: 0; padding: 0; background: #f5f5f5; }
        /* 自绘滚动条（禁系统默认样式）：8px 圆角半透明灰，悬停加深 */
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(138, 138, 138, 0.45); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(138, 138, 138, 0.75); }
        ::-webkit-scrollbar-corner { background: transparent; }
        * { scrollbar-width: thin; scrollbar-color: rgba(138, 138, 138, 0.45) transparent; }
        /* 阶段二百二十一：手机端隐藏滚动条（触屏滚动自带惯性，微信文档预览同款；
           桌面 iframe 宽窗口不受影响仍显示自绘滚动条） */
        @media (max-width: 768px) {
            ::-webkit-scrollbar { width: 0; height: 0; }
            * { scrollbar-width: none; }
        }
        /* 加载中提示 */
        #loading {
            position: fixed; top: 45%; left: 0; right: 0; text-align: center;
            color: #888; font-size: 14px; font-family: "Microsoft YaHei", sans-serif;
        }
        /* 错误提示 */
        #err {
            display: none; position: fixed; top: 42%; left: 0; right: 0; text-align: center;
            color: #999; font-size: 14px; font-family: "Microsoft YaHei", sans-serif; line-height: 2;
        }
        /* docx 渲染容器：docx-preview 自带 .docx-wrapper 页面样式，这里控制边距 */
        #viewer { padding: 12px 0 24px; }
        #viewer .docx-wrapper { background: #f5f5f5; padding: 16px 0; }
        /* xlsx 渲染容器：每个 Sheet 一段（Sheet 名标题 + HTML 表格） */
        .xlsx-sheet { background: #fff; max-width: 960px; margin: 0 auto 20px; padding: 16px 20px; border-radius: 6px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08); }
        .xlsx-sheet h3 { margin: 0 0 12px; font-size: 14px; color: #333; border-left: 3px solid #07c160; padding-left: 8px; font-family: "Microsoft YaHei", sans-serif; }
        .xlsx-sheet table { border-collapse: collapse; font-size: 12px; font-family: "Microsoft YaHei", sans-serif; }
        .xlsx-sheet td { border: 1px solid #e0e0e0; padding: 4px 10px; min-width: 48px; height: 22px; color: #333; white-space: nowrap; }
        /* pdf 渲染容器（pdf.js 逐页 canvas）：白底页居中，页间留缝 */
        .pdf-page { display: block; margin: 0 auto 12px; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12); max-width: 100%; }
    </style>
</head>
<body>
    <div id="loading">文档加载中…</div>
    <div id="err"></div>
    <div id="viewer"></div>
    <script>
        // 解析查询参数（type=docx|xlsx，url=文档地址）
        var qs = {};
        location.search.substring(1).split('&').forEach(function (kv) {
            var i = kv.indexOf('=');
            if (i > 0) qs[decodeURIComponent(kv.substring(0, i))] = decodeURIComponent(kv.substring(i + 1));
        });
        var type = (qs.type || '').toLowerCase();
        var fileUrl = qs.url || '';
        var loadingEl = document.getElementById('loading');
        var errEl = document.getElementById('err');
        var viewerEl = document.getElementById('viewer');

        function showError(msg) {
            loadingEl.style.display = 'none';
            errEl.style.display = 'block';
            errEl.innerHTML = '预览失败：' + msg + '<br>可点击窗口右上角"下载"按钮获取文件';
        }

        // xlsx 预览：逐 Sheet 转 HTML 表格（SheetJS 免费版即可满足）
        function renderXlsx(buf) {
            var wb = XLSX.read(new Uint8Array(buf), { type: 'array' });
            wb.SheetNames.forEach(function (name) {
                var html = XLSX.utils.sheet_to_html(wb.Sheets[name], { header: '', footer: '' });
                var section = document.createElement('div');
                section.className = 'xlsx-sheet';
                var title = document.createElement('h3');
                title.textContent = name;
                section.appendChild(title);
                // sheet_to_html 返回完整 HTML 文档串，innerHTML 赋值时浏览器自动剥离 html/body 外壳仅保留表格
                var holder = document.createElement('div');
                holder.innerHTML = html;
                while (holder.firstChild) section.appendChild(holder.firstChild);
                viewerEl.appendChild(section);
            });
            loadingEl.style.display = 'none';
        }

        // docx 预览：docx-preview 渲染（保留原文档分页/样式，纯前端零服务端）
        function renderDocx(buf) {
            docx.renderAsync(buf, viewerEl, viewerEl, {
                inWrapper: true,
                ignoreLastRenderedPageBreak: false,
                experimental: false
            }).then(function () {
                loadingEl.style.display = 'none';
            }).catch(function (e) {
                showError('文档解析异常');
            });
        }

        // 阶段二百二十一：PDF 预览（pdf.js 逐页渲染，串行出页省内存，大文档首屏快）
        function renderPdf(buf) {
            pdfjsLib.GlobalWorkerOptions.workerSrc = 'js/lib/pdf.worker.min.js?v=1.0';
            pdfjsLib.getDocument({ data: buf }).promise.then(function (pdf) {
                var i = 1;
                (function next() {
                    if (i > pdf.numPages) { loadingEl.style.display = 'none'; return; }
                    pdf.getPage(i).then(function (page) {
                        var base = page.getViewport({ scale: 1 });
                        var target = Math.max(320, Math.min(viewerEl.clientWidth - 24, 960));
                        var vp = page.getViewport({ scale: target / base.width });
                        var canvas = document.createElement('canvas');
                        canvas.className = 'pdf-page';
                        canvas.width = vp.width;
                        canvas.height = vp.height;
                        page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise.then(function () {
                            viewerEl.appendChild(canvas);
                            i++;
                            next();
                        });
                    }).catch(function () { loadingEl.style.display = 'none'; });
                })();
            }).catch(function () {
                showError('PDF 解析失败');
            });
        }

        if (!fileUrl) {
            // 无查询参数：等待父窗口（doc-viewer.html）postMessage 推送地址（blob 场景 dataURL 中转）
            // 阶段一百三十四：独立文档查看器无法访问主聊天页的 blob:，父窗口把 blob 转成自包含
            // data: URL 后经 message 推入本页渲染；与查询参数二选一，先到先渲染
            window.addEventListener('message', function (ev) {
                if (!ev.data || ev.data.type !== 'doc-preview-src' || !ev.data.url) return;
                loadAndRender(ev.data.url);
            });
        } else {
            loadAndRender(fileUrl);
        }

        // 加载并渲染（查询参数与 postMessage 双入口共用归口）
        // 阶段二百八十三：APP 端先查本地缓存——命中读缓存直渲染（零下载，微信同款第二次打开
        // 秒开）；未命中走原 fetch 下载，完成后回写缓存（预览页右上"下载"按钮经 openCached 同键命中）
        // 阶段二百八十三补：本页运行于主窗口 iframe 内，Capacitor 桥与 P2PFile 均只在主 frame
        // ——iframe 里 window.P2PFile 必为 undefined，缓存分支永远被跳过。同源回退父窗口取用。
        // 阶段二百八十四：PC 端同经 P2PFile 缓存归口（主窗口时函数内自行分支 desktop 主进程
        // 磁盘缓存；独立 doc-viewer 窗口时父窗口注入同签名 shim），判断收敛为仅 P2P——
        // 浏览器端无缓存能力时函数内部自动旁路，行为不变
        var P2P = window.P2PFile || (function () { try { return window.parent && window.parent.P2PFile || null; } catch (_) { return null; } })();
        function urlName(u) {
            var p = String(u || '').split('?')[0].split('#')[0];
            try { p = decodeURIComponent(p); } catch (_) {}
            return p.substring(p.lastIndexOf('/') + 1) || 'file';
        }
        function loadAndRender(u) {
            if (P2P && P2P.cacheRead &&
                u.indexOf('blob:') !== 0 && u.indexOf('data:') !== 0) {
                loadingEl.textContent = '正在检查本地缓存…';
                // 阶段二百八十三：小文件读缓存直渲染（零下载秒开）；超大文件拒绝读回（Filesystem.readFile
                // 内存 ≈ 体积×3.7，161.9MB 实测 OOM 闪退）——微信同款直接系统打开已缓存文件
                P2P.cacheRead(u, urlName(u), 25 * 1024 * 1024).then(function (r) {
                    if (r && r.tooBig) {
                        loadingEl.textContent = '文件较大（约 ' + (r.size / 1048576).toFixed(1) + ' MB），已改用本地应用打开';
                        if (P2P.openCached) P2P.openCached(u, urlName(u));
                        return;
                    }
                    if (r) {
                        loadingEl.textContent = '已从本地缓存读取…';
                        renderBuf(r.buffer.slice(r.byteOffset, r.byteOffset + r.byteLength));
                        return;
                    }
                    loadAndRenderNet(u);
                }).catch(function () { loadAndRenderNet(u); });
                return;
            }
            loadAndRenderNet(u);
        }
        function loadAndRenderNet(u) {
            fetch(u).then(function (res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.arrayBuffer();
            }).then(function (buf) {
                // 阶段二百八十三：APP 端下载完成回写本地缓存（分片异步写盘不阻塞渲染；blob:/data: 源内部自动跳过）
                if (P2P && P2P.cacheWrite) {
                    try { P2P.cacheWrite(u, urlName(u), new Blob([buf])); } catch (_) {}
                }
                renderBuf(buf);
            }).catch(function (e) {
                showError('文档加载失败');
            });
        }
        function renderBuf(buf) {
            if (type === 'xlsx') renderXlsx(buf);
            else if (type === 'pdf') renderPdf(buf);
            else renderDocx(buf);
        }
    </script>
</body>
</html>

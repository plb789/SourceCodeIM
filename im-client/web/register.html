<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>注册账号 - 即时通讯</title>
    <!-- 阶段一四五：独立账号注册页（与登录页同款左右分栏卡片风格，主题变量/深色模式复用 css/style.css） -->
    <!-- 手机版 APP 壳引导（Capacitor 专用）：浏览器环境自动跳过；页面间导航携带 __app=1 标记防壳层误跳转 -->
    <script src="js/app-shell.js?v=1.0"></script>
    <link rel="stylesheet" href="css/style.css?v=2.43">
    <style>
        /* 注册页专属样式（仅少量补充，主体复用登录页类名；主题色归口 --primary） */
        html, body { margin: 0; padding: 0; }

        /* 卡片高度对齐（阶段一四五）：注册表单比登录页多"确认密码"一组字段，内容自然高度 581px
           超出登录页卡片 min-height 560px 兜底，跳转时卡片肉眼可见变高。
           此处压缩注册页表单垂直间距（副标题下距 26→20、输入框下距 18→13，共省 21px），
           使内容回到 560px 内，两页卡片高度完全一致，跳转无高度跳变 */
        .login-form-sub {
            margin-bottom: 20px;
        }

        .login-field {
            margin-bottom: 13px;
        }

        /* 自绘 Toast 提示（规则：禁止系统默认弹窗，全部页面内自绘） */
        .reg-toast {
            position: fixed;
            top: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(-12px);
            z-index: 9999;
            padding: 10px 22px;
            border-radius: 8px;
            font-size: 13px;
            color: #ffffff;
            background: var(--primary);
            box-shadow: 0 6px 24px rgba(0, 0, 0, 0.22);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.22s ease, transform 0.22s ease;
            max-width: 86vw;
            text-align: center;
        }

        .reg-toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .reg-toast.reg-toast-error {
            background: #d9534f;
        }

        /* 注册页底部返回登录链接样式归口 css/style.css 的 .login-reg-link（与登录页注册入口同款，跟随主题色） */
    </style>
</head>
<body>
    <div class="login-view" style="position: relative;">
        <div class="login-card">
            <!-- 左侧品牌区（与登录页同款深色主色调面板 + 装饰圆环） -->
            <div class="login-brand">
                <div class="login-brand-ring" aria-hidden="true"></div>
                <div class="login-brand-body">
                    <p class="login-brand-caption">INSTANT MESSENGER PLATFORM</p>
                    <h1 class="login-brand-title">即时通讯</h1>
                    <p class="login-brand-desc">创建您的专属账号，即刻加入企业沟通平台，与同事高效协作。</p>
                    <div class="login-brand-tags">
                        <span class="login-tag">即时沟通</span>
                        <span class="login-tag">文件传输</span>
                        <span class="login-tag">AI 助手</span>
                    </div>
                    <div class="login-brand-foot">
                        <p class="login-foot-label">安全接入</p>
                        <p class="login-foot-links"><span class="login-foot-link">山西梗阳新能源有限公司</span></p>
                    </div>
                </div>
            </div>
            <!-- 右侧注册表单区（与登录页同款浅色面板） -->
            <div class="login-form-panel">
                <p class="login-form-caption">ACCOUNT SIGN UP</p>
                <h2 class="login-form-title">注册账号</h2>
                <p class="login-form-sub">设置账号与密码，注册完成后将自动登录。</p>
                <label class="login-label" for="reg-username">账号</label>
                <div class="login-field">
                    <span class="login-field-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M12 12a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm0 2c-3.31 0-8 1.67-8 5v1a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-1c0-3.33-4.69-5-8-5z"/></svg>
                    </span>
                    <input type="text" id="reg-username" placeholder="请输入账号（字母、数字或组合）" autocomplete="off">
                </div>
                <label class="login-label" for="reg-password">密码</label>
                <div class="login-field">
                    <span class="login-field-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1zM9 7a3 3 0 0 1 6 0v2H9zm3 12a2 2 0 1 1 2-2 2 2 0 0 1-2 2z"/></svg>
                    </span>
                    <input type="password" id="reg-password" placeholder="请输入密码" autocomplete="new-password">
                    <button type="button" id="reg-eye" class="login-eye" title="显示密码">
                        <svg id="reg-eye-show" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M12 5c-5 0-9.3 3.1-10.4 7.4a.9.9 0 0 0 0 .2C2.7 16.9 7 20 12 20s9.3-3.1 10.4-7.4a.9.9 0 0 0 0-.2C21.3 8.1 17 5 12 5zm0 12.5A4.5 4.5 0 1 1 16.5 13 4.5 4.5 0 0 1 12 17.5zm0-7A2.5 2.5 0 1 0 14.5 13 2.5 2.5 0 0 0 12 10.5z"/></svg>
                        <svg id="reg-eye-hide" class="hidden" viewBox="0 0 24 24" width="18" height="18"><path fill="currentColor" d="M2.1 3.5 3.5 2.1l18.4 18.4-1.4 1.4-3.2-3.2A11.7 11.7 0 0 1 12 20c-5 0-9.3-3.1-10.4-7.4a.9.9 0 0 1 0-.2A12 12 0 0 1 5.4 7.9zm4.8 4.8a4.5 4.5 0 0 0 6.3 6.3zM12 5c5 0 9.3 3.1 10.4 7.4a.9.9 0 0 1 0 .2 11.6 11.6 0 0 1-2.5 4.4l-2.9-2.9A4.5 4.5 0 0 0 11.4 8l-1.6-1.6A12.6 12.6 0 0 1 12 5z"/></svg>
                    </button>
                </div>
                <label class="login-label" for="reg-password2">确认密码</label>
                <div class="login-field">
                    <span class="login-field-icon">
                        <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M17 9V7a5 5 0 0 0-10 0v2H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1V10a1 1 0 0 0-1-1zM9 7a3 3 0 0 1 6 0v2H9zm3 12a2 2 0 1 1 2-2 2 2 0 0 1-2 2z"/></svg>
                    </span>
                    <input type="password" id="reg-password2" placeholder="请再次输入密码" autocomplete="new-password">
                </div>
                <button id="register-btn">注 册</button>
                <p class="login-hint">已有账号？<a class="login-reg-link" href="index.html?__app=1">返回登录</a></p>
                <p class="login-form-foot">© 2026 即时通讯 · 山西梗阳新能源有限公司</p>
            </div>
        </div>
    </div>
    <!-- 自绘 Toast（禁止系统默认弹窗） -->
    <div id="reg-toast" class="reg-toast"></div>

    <script src="js/socket.js?v=1.27"></script>
    <script>
    (function () {
        'use strict';

        // ===== 主题初始化（与 chat.js getTheme 同规则：localStorage im_theme，light/dark/system） =====
        var savedTheme = 'light';
        try { savedTheme = localStorage.getItem('im_theme') || 'light'; } catch (e) {}
        document.documentElement.setAttribute('data-theme', savedTheme);

        var usernameEl = document.getElementById('reg-username');
        var passwordEl = document.getElementById('reg-password');
        var password2El = document.getElementById('reg-password2');
        var btn = document.getElementById('register-btn');
        var toastEl = document.getElementById('reg-toast');
        var toastTimer = null;
        var submitting = false;

        // ===== 自绘 Toast 提示 =====
        function showToast(text, isError) {
            toastEl.textContent = text;
            toastEl.classList.toggle('reg-toast-error', !!isError);
            toastEl.classList.add('show');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(function () {
                toastEl.classList.remove('show');
            }, 2600);
        }

        // ===== 密码显隐切换（与登录页同款眼睛按钮） =====
        var eyeBtn = document.getElementById('reg-eye');
        var eyeShow = document.getElementById('reg-eye-show');
        var eyeHide = document.getElementById('reg-eye-hide');
        eyeBtn.addEventListener('click', function () {
            var show = passwordEl.type === 'password';
            passwordEl.type = show ? 'text' : 'password';
            password2El.type = show ? 'text' : 'password';
            eyeShow.classList.toggle('hidden', show);
            eyeHide.classList.toggle('hidden', !show);
            eyeBtn.title = show ? '隐藏密码' : '显示密码';
        });

        function setSubmitting(v) {
            submitting = v;
            btn.disabled = v;
            btn.textContent = v ? '注册中…' : '注 册';
        }

        // ===== 注册提交 =====
        function doRegister() {
            if (submitting) return;
            var username = usernameEl.value.trim();
            var password = passwordEl.value;
            var password2 = password2El.value;
            if (!username) { showToast('请输入账号', true); usernameEl.focus(); return; }
            if (!password) { showToast('请输入密码', true); passwordEl.focus(); return; }
            if (password !== password2) { showToast('两次输入的密码不一致', true); password2El.focus(); return; }
            setSubmitting(true);
            // 独立注册通道：短连接发 REGISTER 信令，服务端校验（重名/保留字/空值）后回执
            IMSocket.register(username, password, function (ok, text) {
                if (ok) {
                    // 注册成功：凭据写入与 chat.js saveAuth 同格式（登录持久化），
                    // 跳转 index.html 由自动登录链路完成正式登录（走 LOGIN_RESP 完成全部登录推送）
                    try {
                        localStorage.setItem('im_auth', btoa(encodeURIComponent(JSON.stringify({ u: username, p: password }))));
                    } catch (e) {}
                    showToast(text || '注册成功，正在进入…', false);
                    setTimeout(function () {
                        location.href = 'index.html?__app=1';
                    }, 900);
                } else {
                    setSubmitting(false);
                    showToast(text || '注册失败，请稍后重试', true);
                }
            });
        }

        btn.addEventListener('click', doRegister);
        // 回车快捷提交（任一输入框内回车均触发）
        [usernameEl, passwordEl, password2El].forEach(function (el) {
            el.addEventListener('keydown', function (e) {
                if (e.key === 'Enter') doRegister();
            });
        });
    })();
    </script>
</body>
</html>

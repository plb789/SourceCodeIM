<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>录制中</title>
    <!-- 主题首绘引导：与主界面同源读 im_theme（dark/light，默认 dark）——跟随主题变量 -->
    <script>
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('im_theme') || 'dark'); }
        catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
    <!-- 引用全站样式表：主题 CSS 变量（--panel-bg/--border/--text），本页禁止硬编码颜色 -->
    <link rel="stylesheet" href="css/style.css?v=3.80">
    <style>
        html, body { background: transparent; overflow: hidden; }
        /* 无边框自绘悬浮条：整条可拖动换位（微信录制条同款），停止按钮 no-drag */
        .rec-bar {
            display: flex; align-items: center; gap: 10px;
            height: 44px; padding: 0 12px; margin: 6px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.35);
            -webkit-app-region: drag;
            user-select: none;
        }
        .rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #fa5151; animation: recblink 1s infinite; flex-shrink: 0; }
        @keyframes recblink { 50% { opacity: 0.25; } }
        .rec-time { font-size: 13px; color: var(--text); font-variant-numeric: tabular-nums; }
        .rec-stop {
            -webkit-app-region: no-drag;
            height: 28px; padding: 0 14px;
            border: none; border-radius: 6px;
            background: #fa5151; color: #fff; font-size: 13px; cursor: pointer;
        }
        .rec-stop:hover { filter: brightness(1.1); }
    </style>
</head>
<body>
    <div class="rec-bar">
        <span class="rec-dot"></span>
        <span class="rec-time" id="rec-time">00:00</span>
        <button class="rec-stop" id="rec-stop">停止</button>
    </div>
    <script src="js/i18n.js?v=3.33"></script>
    <script>
        (function () {
            var t0 = 0;
            try { t0 = parseInt(new URLSearchParams(location.search).get('t0') || '0', 10) || 0; } catch (e) { }
            if (!t0) t0 = Date.now();
            var timeEl = document.getElementById('rec-time');
            var stopBtn = document.getElementById('rec-stop');
            try { if (window.I18N) stopBtn.textContent = I18N.t('停止'); } catch (e) { }
            function tick() {
                var s = Math.max(0, Math.floor((Date.now() - t0) / 1000));
                var mm = Math.floor(s / 60), ss = s % 60;
                timeEl.textContent = (mm < 10 ? '0' : '') + mm + ':' + (ss < 10 ? '0' : '') + ss;
            }
            tick();
            setInterval(tick, 500);
            stopBtn.addEventListener('click', function () {
                if (window.desktop && window.desktop.recbarStop) window.desktop.recbarStop();
            });
        })();
    </script>
</body>
</html>

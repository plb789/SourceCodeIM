<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>游戏内面板</title>
    <script>
        /* 主题首绘引导：与主界面同源读 im_theme（dark/light/system，默认 dark），
           先于样式渲染设置 data-theme，避免深色主题下先浅后深闪屏（game-store.html 同款） */
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('im_theme') || 'dark'); }
        catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
    <!-- 引用全站样式表：主题 CSS 变量（--bg/--panel-bg/--primary/--border 等）、
         全局原生滚动条归零与自绘悬浮滑块 .osb-thumb 样式均来自这里，本页禁止硬编码颜色 -->
    <link rel="stylesheet" href="css/style.css?v=3.79">
    <link rel="stylesheet" href="css/overlay.css?v=1">
</head>
<body>
    <!-- 全屏遮罩：Steam overlay 观感；点击空白处收起（焦点归还游戏由主进程 hide 归口） -->
    <div id="ov-mask"></div>

    <!-- 居中卡片（微信式布局：左列表右会话 / 页签切换） -->
    <div id="ov-panel">
        <div id="ov-head">
            <span id="ov-title">游戏内面板</span>
            <span id="ov-hotkey">Shift+Tab</span>
            <span id="ov-close" title="关闭（Esc）">&#10005;</span>
        </div>
        <div id="ov-conn" class="hidden">连接已断开，请在主窗口重新登录</div>

        <div id="ov-tabs">
            <div class="ov-tab active" data-tab="friends">好友</div>
            <div class="ov-tab" data-tab="room">房间</div>
            <div class="ov-tab" data-tab="lobby">大厅</div>
        </div>

        <div id="ov-body">
            <!-- 好友页签：左在线好友列表 / 右私聊会话（微信式） -->
            <div id="ov-friends" class="ov-page active">
                <div id="ov-friend-list" class="ov-scroll"></div>
                <div id="ov-chat" class="hidden">
                    <div id="ov-chat-head">
                        <span id="ov-chat-back">&larr;</span>
                        <span id="ov-chat-name"></span>
                        <span id="ov-chat-status"></span>
                    </div>
                    <div id="ov-chat-hint">游戏内仅显示本时段消息，完整记录退出游戏后在主窗口查看</div>
                    <div id="ov-chat-msgs" class="ov-scroll"></div>
                    <div id="ov-chat-input-wrap">
                        <textarea id="ov-chat-input" rows="1" placeholder="输入消息，回车发送"></textarea>
                        <button id="ov-chat-send">发送</button>
                    </div>
                </div>
            </div>

            <!-- 房间页签：邀请条（两种状态共享：在房时收到的其他房间邀请也可见可接受） -->
            <div id="ov-room" class="ov-page">
                <div id="ov-invites" class="hidden"></div>
                <div id="ov-room-mine" class="hidden">
                    <div id="ov-room-card">
                        <div id="ov-room-line1">
                            <span id="ov-room-name"></span>
                            <span id="ov-room-status"></span>
                        </div>
                        <div id="ov-room-line2"></div>
                        <div id="ov-room-actions">
                            <button id="ov-room-invite">邀请好友</button>
                            <button id="ov-room-ready">准备</button>
                            <button id="ov-room-leave">退出房间</button>
                        </div>
                        <div id="ov-room-hint">开局 / 结束对局请到游戏中心窗「联机大厅」操作</div>
                    </div>
                    <div id="ov-room-members" class="ov-scroll"></div>
                    <div id="ov-room-msgs" class="ov-scroll"></div>
                    <div id="ov-room-input-wrap">
                        <input id="ov-room-input" type="text" maxlength="200" placeholder="房间内聊天">
                        <button id="ov-room-send">发送</button>
                    </div>
                </div>
                <div id="ov-room-none">
                    <div id="ov-room-none-tip">当前未在房间中</div>
                    <div id="ov-room-list" class="ov-scroll"></div>
                    <div id="ov-room-none-actions">
                        <button id="ov-room-create">创建房间</button>
                        <span id="ov-room-none-hint">加入 / 创建由游戏中心窗后台执行，不干扰游戏</span>
                    </div>
                </div>
            </div>

            <!-- 大厅页签：在场玩家 + 大厅聊天（112，不落库） -->
            <div id="ov-lobby" class="ov-page">
                <div id="ov-lobby-users" class="ov-scroll"></div>
                <div id="ov-lobby-msgs" class="ov-scroll"></div>
                <div id="ov-lobby-input-wrap">
                    <input id="ov-lobby-input" type="text" maxlength="200" placeholder="大厅聊天">
                    <button id="ov-lobby-send">发送</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 邀请好友弹层（房间页签）：在线好友逐人一键邀请，邀请后行内标记（游戏内少操作） -->
    <div id="ov-invite-mask" class="hidden">
        <div id="ov-invite-box">
            <div id="ov-invite-head">
                <span>邀请在线好友</span>
                <span id="ov-invite-close">&#10005;</span>
            </div>
            <div id="ov-invite-list" class="ov-scroll"></div>
        </div>
    </div>

    <div id="ov-toast" class="hidden"></div>

    <!-- i18n：主窗口同款语言包（静态文本 I18N.t） -->
    <script src="js/i18n.js?v=1"></script>
    <!-- 联机信令收发口：本窗无 WS，经主进程 IPC 中继复用主窗口唯一 WebSocket -->
    <script src="js/gn-signal.js?v=1"></script>
    <script src="js/overlay.js?v=5"></script>
</body>
</html>

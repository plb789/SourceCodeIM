<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>成就通知</title>
    <script>
        /* 主题首绘引导：与主界面同源读 im_theme（dark/light，默认 dark），
           先于样式渲染设置 data-theme，避免深色主题下先浅后深闪屏（notify.html 同款） */
        try { document.documentElement.setAttribute('data-theme', localStorage.getItem('im_theme') || 'dark'); }
        catch (e) { document.documentElement.setAttribute('data-theme', 'dark'); }
    </script>
    <!-- 引用全站样式表：主题 CSS 变量（--panel-bg/--border/--text 等），本页禁止硬编码颜色 -->
    <link rel="stylesheet" href="css/style.css?v=3.80">
    <style>
        /* toast 堆叠区：窗口本体即通知区域（屏幕右下角 360×330，内容锚定底部右对齐），
           栈空时主进程隐藏窗口（透明窗体不挡桌面操作） */
        html, body { background: transparent; margin: 0; padding: 0; overflow: hidden; }
        #ach-stack {
            position: fixed;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            align-items: flex-end;
            gap: 8px;
            padding: 12px;
            width: 360px;
        }
        /* 通知窗内卡片默认全可见（无滑入动画依赖：独立窗不参与主窗口冻结问题，直接显示） */
        #ach-stack .ach-toast { opacity: 1; transform: none; transition: none; cursor: pointer; }
    </style>
</head>
<body>
    <div id="ach-stack"></div>

    <script src="js/i18n.js?v=3.33"></script>
    <!-- 卡片视觉与页内 toast 完全同源：AchievementToast.buildCard 由组件暴露 -->
    <script src="js/achievement-toast.js?v=1.5"></script>
    <script src="js/achievement-notify.js?v=1"></script>
</body>
</html>

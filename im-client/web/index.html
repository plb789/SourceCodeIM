<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即时通讯</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 登录视图 -->
    <div id="login-view" class="login-view">
        <div class="login-box">
            <h1>即时通讯</h1>
            <p class="login-subtitle">Go + WebSocket 轻量 IM 系统</p>
            <input type="text" id="login-username" placeholder="用户名" autocomplete="off">
            <input type="password" id="login-password" placeholder="密码" autocomplete="off">
            <button id="login-btn">登 录</button>
            <p class="login-hint">首次登录将自动注册</p>
        </div>
    </div>

    <!-- 聊天视图 -->
    <div id="chat-view" class="chat-view hidden">
        <!-- 左侧栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <img id="current-avatar" class="avatar current-avatar" src="" alt="头像" title="点击更换头像">
                <span id="current-user" class="current-user"></span>
                <button id="theme-btn" class="logout-btn" title="切换主题">主题</button>
                <button id="logout-btn" class="logout-btn">退出</button>
            </div>
            <div class="sidebar-title">在线用户</div>
            <ul id="user-list" class="user-list">
                <li class="user-item group-item active" data-user="">群聊</li>
            </ul>
        </div>

        <!-- 主聊天区 -->
        <div class="main-chat">
            <div class="chat-header">
                <span id="chat-title">群聊</span>
                <span id="chat-status" class="chat-status"></span>
            </div>
            <div id="message-list" class="message-list"></div>
            <div class="input-bar">
                <textarea id="message-input" placeholder="输入消息，回车发送" rows="1"></textarea>
                <button id="send-btn">发送</button>
            </div>
        </div>
    </div>

    <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/gif" class="hidden">

    <script src="js/socket.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>

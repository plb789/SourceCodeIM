<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>即时通讯</title>
    <link rel="stylesheet" href="css/style.css?v=1.3">
</head>
<body>
    <!-- 登录视图 -->
    <div id="login-view" class="login-view">
        <div class="login-box">
            <h1>即时通讯</h1>
            <p class="login-subtitle">Go + WebSocket 轻量 IM 系统</p>
            <input type="text" id="login-username" placeholder="用户名" autocomplete="off">
            <input type="password" id="login-password" placeholder="密码" autocomplete="off">
            <button id="login-btn">登 录</button>
            <p class="login-hint">首次登录将自动注册</p>
        </div>
    </div>

    <!-- 聊天视图 -->
    <div id="chat-view" class="chat-view hidden">
        <!-- 左侧栏 -->
        <div class="sidebar">
            <div class="sidebar-header">
                <img id="current-avatar" class="avatar current-avatar" src="" alt="头像" title="点击更换头像">
                <span id="current-user" class="current-user"></span>
                <button id="add-friend-btn" class="logout-btn" title="添加好友">＋</button>
                <button id="theme-btn" class="logout-btn" title="切换主题">主题</button>
                <button id="logout-btn" class="logout-btn">退出</button>
            </div>
            <!-- 侧栏 Tab：聊天（会话列表）/ 好友（通讯录） -->
            <div class="sidebar-tabs">
                <div class="sidebar-tab active" data-tab="chat">聊天</div>
                <div class="sidebar-tab" data-tab="friends">好友</div>
            </div>

            <!-- 最近会话列表（聊天 Tab） -->
            <ul id="conv-list" class="user-list conv-list"></ul>

            <!-- 好友面板（好友 Tab） -->
            <div id="friends-panel" class="friends-panel hidden">
                <div class="search-bar">
                    <input id="search-input" placeholder="搜索聊天记录（回车）">
                    <button id="search-clear-btn" class="hidden" title="关闭搜索结果">×</button>
                </div>
                <ul id="user-list" class="user-list">
                    <li class="user-item group-item active" data-user="">群聊</li>
                </ul>

                <!-- 搜索结果面板 -->
                <div id="search-panel" class="search-panel hidden"></div>
            </div>
        </div>
        <!-- 主聊天区 -->
        <div class="main-chat">
            <div class="chat-header">
                <span id="chat-title">群聊</span>
                <span id="chat-status" class="chat-status"></span>
                <button id="conv-search-btn" class="logout-btn" title="搜索聊天记录">
                    <svg viewBox="0 0 24 24" width="16" height="16"><path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/></svg>
                </button>
            </div>
            <!-- 置顶消息条：服务端归口，双方同步 -->
            <div id="pin-bar" class="pin-bar hidden">
                <span class="pin-bar-icon">📌</span>
                <div class="pin-bar-main">
                    <span id="pin-bar-user" class="pin-bar-user"></span>
                    <span id="pin-bar-text" class="pin-bar-text"></span>
                </div>
                <button id="pin-bar-close" class="pin-bar-close" title="取消置顶">×</button>
            </div>
            <div id="message-list" class="message-list"></div>
            <!-- 会话内搜索浮层：结果点击定位到消息并高亮 -->
            <div id="conv-search" class="conv-search hidden">
                <div class="conv-search-bar">
                    <input id="conv-search-input" placeholder="搜索聊天记录，回车确认">
                    <button id="conv-search-close" title="关闭">×</button>
                </div>
                <div id="conv-search-results" class="conv-search-results hidden"></div>
            </div>
            <!-- 微信风格输入区：工具栏 + 输入框 + 底部操作行 -->
            <div class="input-bar">
                <div class="input-toolbar">
                    <button id="emoji-btn" class="tool-btn" title="表情">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm-7 0a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
                    </button>
                    <button id="image-btn" class="tool-btn" title="发送图片">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M21 4H3a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h18a1 1 0 0 0 1-1V5a1 1 0 0 0-1-1zm-1 12.5-4.5-5-3.5 4-3-3.5L4 17.5V6h16v10.5zM8 11a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/></svg>
                    </button>
                    <button id="file-btn" class="tool-btn" title="发送文件">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M20 6h-8l-2-2H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2zm0 12H4V8h16v10z"/></svg>
                    </button>
                    <button id="screenshot-btn" class="tool-btn" title="截图发送">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M17 3h-2.18A3 3 0 0 0 12 1a3 3 0 0 0-2.82 2H4a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V4a1 1 0 0 0-1-1zm-5 0a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm6 16H5V5h2v2h10V5h2v14zM12 8a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 8a3 3 0 1 1 0-6 3 3 0 0 1 0 6z"/></svg>
                    </button>
                    <button id="clear-btn" class="tool-btn" title="清空当前聊天显示">
                        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 19a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
                    </button>
                </div>
                <textarea id="message-input" placeholder="输入消息" rows="3"></textarea>
                <div class="input-footer">
                    <span class="input-hint">Enter 发送 / Ctrl+Enter 换行</span>
                    <button id="send-btn">发送</button>
                </div>
            </div>

            <!-- 表情面板（自定义，禁止系统默认弹窗） -->
            <div id="emoji-panel" class="emoji-panel hidden"></div>
        </div>
    </div>

    <input type="file" id="avatar-file" accept="image/jpeg,image/png,image/gif" class="hidden">
    <input type="file" id="image-input" accept="image/*" class="hidden">
    <input type="file" id="file-input" class="hidden">

    <!-- 好友右键菜单 -->
    <div id="friend-menu" class="friend-menu hidden">
        <div class="menu-item" data-action="remark">设置备注</div>
        <div class="menu-item" data-action="block">拉黑</div>
        <div class="menu-item" data-action="delete">删除好友</div>
    </div>

    <!-- 消息右键菜单（置顶/撤回/删除） -->
    <div id="msg-menu" class="friend-menu hidden">
        <div class="menu-item" data-action="pin">置顶</div>
        <div class="menu-item" data-action="recall">撤回</div>
        <div class="menu-item" data-action="del">删除</div>
    </div>

    <!-- 会话右键菜单（置顶/清空/删除） -->
    <div id="conv-menu" class="friend-menu hidden">
        <div class="menu-item" data-action="pin">置顶聊天</div>
        <div class="menu-item" data-action="clear">清空聊天记录</div>
        <div class="menu-item danger" data-action="delete">删除会话</div>
    </div>

    <!-- 自定义弹窗（确认/输入），禁止使用系统默认弹窗 -->
    <div id="modal-mask" class="modal-mask hidden">
        <div class="modal-box">
            <div id="modal-title" class="modal-title"></div>
            <div id="modal-text" class="modal-text"></div>
            <input type="text" id="modal-input" class="modal-input hidden" autocomplete="off">
            <div class="modal-btns">
                <button id="modal-cancel" class="modal-btn">取消</button>
                <button id="modal-ok" class="modal-btn primary">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast 轻提示 -->
    <div id="toast" class="toast hidden"></div>

    <script src="js/socket.js?v=1.10"></script>
    <script src="js/chat.js?v=1.12"></script>
</body>
</html>

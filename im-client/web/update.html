<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发现新版本</title>
<style>
    /* 阶段二百六十：PC 自动更新窗（自绘，禁用系统弹窗；主题经 ?theme= 参数跟随设置页深浅） */
    :root {
        --bg: #f5f5f5;
        --card: #ffffff;
        --text: #1f1f1f;
        --text-sub: #6b6b6b;
        --line: rgba(0, 0, 0, 0.08);
        --primary: #07c160;
        --primary-press: #06ad55;
        --track: #e4e4e4;
        --btn-ghost-text: #575757;
        --btn-ghost-bg: rgba(0, 0, 0, 0.05);
        --btn-ghost-press: rgba(0, 0, 0, 0.09);
        --err: #e64340;
    }
    html[data-theme="dark"] {
        --bg: #1a1a1a;
        --card: #232323;
        --text: #e6e6e6;
        --text-sub: #9a9a9a;
        --line: rgba(255, 255, 255, 0.08);
        --primary: #07c160;
        --primary-press: #06ad55;
        --track: #333333;
        --btn-ghost-text: #b5b5b5;
        --btn-ghost-bg: rgba(255, 255, 255, 0.08);
        --btn-ghost-press: rgba(255, 255, 255, 0.13);
        --err: #e64340;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
        background: var(--bg);
        color: var(--text);
        font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
        font-size: 14px;
        overflow: hidden;
        user-select: none;
        display: flex;
        flex-direction: column;
    }
    /* 标题栏（无边框窗自绘拖拽区） */
    .titlebar {
        height: 40px;
        display: flex;
        align-items: center;
        padding: 0 14px;
        -webkit-app-region: drag;
        flex: none;
    }
    .titlebar .tb-title { font-size: 13px; color: var(--text-sub); }
    .titlebar .tb-close {
        margin-left: auto;
        -webkit-app-region: no-drag;
        width: 28px; height: 28px;
        border: none; background: transparent;
        color: var(--text-sub);
        font-size: 16px; line-height: 1;
        border-radius: 6px;
        cursor: pointer;
    }
    .titlebar .tb-close:hover { background: var(--btn-ghost-bg); color: var(--text); }
    .titlebar .tb-close.hidden { display: none; }
    /* 主体 */
    .main {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 6px 22px 18px;
        min-height: 0;
    }
    .ver-line { display: flex; align-items: baseline; gap: 8px; flex: none; }
    .ver-line .big { font-size: 20px; font-weight: 600; }
    .ver-line .from { font-size: 12px; color: var(--text-sub); }
    .force-tag {
        flex: none;
        align-self: flex-start;
        display: inline-block;
        font-size: 11px;
        color: var(--err);
        border: 1px solid var(--err);
        border-radius: 4px;
        padding: 1px 6px;
        margin-top: 8px;
    }
    .notes-wrap {
        flex: 1;
        min-height: 0;
        margin-top: 10px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px 12px;
        overflow-y: auto;
        font-size: 13px;
        color: var(--text-sub);
        line-height: 1.7;
        white-space: pre-wrap;
        user-select: text;
    }
    .notes-wrap:empty::before { content: "本次更新内容暂无说明"; }
    /* 自绘悬浮滚动条（项目统一样式，禁系统默认） */
    .notes-wrap::-webkit-scrollbar { width: 6px; }
    .notes-wrap::-webkit-scrollbar-thumb {
        background: rgba(128, 128, 128, 0.35);
        border-radius: 3px;
    }
    .notes-wrap:hover::-webkit-scrollbar-thumb { background: rgba(128, 128, 128, 0.55); }
    .notes-wrap::-webkit-scrollbar-track { background: transparent; }
    /* 进度区 */
    .progress-zone { flex: none; margin-top: 12px; display: none; }
    .progress-zone.show { display: block; }
    .progress-text { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; display: flex; justify-content: space-between; }
    .progress-track { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
    .progress-bar { height: 100%; width: 0%; border-radius: 3px; background: var(--primary); transition: width .25s ease; }
    .err-text { color: var(--err); font-size: 12px; margin-top: 8px; display: none; }
    .err-text.show { display: block; }
    /* 按钮区 */
    .btns { flex: none; display: flex; gap: 10px; margin-top: 16px; }
    .btn {
        flex: 1;
        height: 38px;
        border: none;
        border-radius: 8px;
        font-size: 14px;
        cursor: pointer;
        background: var(--btn-ghost-bg);
        color: var(--btn-ghost-text);
    }
    .btn:hover { background: var(--btn-ghost-press); }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-press); }
    .btn:disabled { opacity: .55; cursor: default; }
    .btn.hidden { display: none; }
</style>
</head>
<body>
    <div class="titlebar">
        <span class="tb-title">即时通讯 - 软件更新</span>
        <button class="tb-close" id="tb-close" title="以后再说">✕</button>
    </div>
    <div class="main">
        <div class="ver-line">
            <span class="big" id="ver-big">发现新版本</span>
            <span class="from" id="ver-from"></span>
        </div>
        <span class="force-tag hidden" id="force-tag">强制更新 · 必须完成更新才能继续使用</span>
        <div class="notes-wrap" id="notes"></div>
        <div class="progress-zone" id="prog-zone">
            <div class="progress-text"><span id="prog-label">下载中…</span><span id="prog-pct">0%</span></div>
            <div class="progress-track"><div class="progress-bar" id="prog-bar"></div></div>
        </div>
        <div class="err-text" id="err-text"></div>
        <div class="btns">
            <button class="btn" id="btn-later">以后再说</button>
            <button class="btn primary" id="btn-update">立即更新</button>
        </div>
    </div>
<script>
(function () {
    // 主题参数（主进程按设置页深浅注入 ?theme=）
    var theme = new URLSearchParams(location.search).get('theme');
    if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');

    var bridge = window.desktop || null;
    var $ = function (id) { return document.getElementById(id); };
    var info = null;
    var state = { phase: 'idle', percent: 0, msg: '' };

    function fmtSize(n) {
        if (!n) return '';
        if (n < 1024) return n + ' B';
        var units = ['KB', 'MB', 'GB'], v = n, i = -1;
        while (v >= 1024 && i < units.length - 1) { v /= 1024; i++; }
        return v.toFixed(v >= 100 ? 0 : 1) + ' ' + units[i];
    }

    function render() {
        var force = !!(info && info.force);
        // 强制更新隐藏一切关闭入口（✕ + 以后再说）
        $('tb-close').classList.toggle('hidden', force);
        $('btn-later').classList.toggle('hidden', force);
        $('force-tag').classList.toggle('hidden', !force);

        if (info && info.version) {
            $('ver-big').textContent = '发现新版本 v' + info.version;
            $('ver-from').textContent = info.current ? ('当前 v' + info.current) : '';
            $('notes').textContent = info.notes || '';
        }
        var ph = state.phase;
        var showProg = (ph === 'downloading' || ph === 'downloaded' || ph === 'installing');
        $('prog-zone').classList.toggle('show', showProg);
        $('err-text').classList.toggle('show', ph === 'error');
        if (ph === 'error') $('err-text').textContent = state.msg || '更新失败，请稍后重试';

        var bu = $('btn-update');
        var bl = $('btn-later');
        bu.disabled = false;
        if (ph === 'available' || ph === 'idle') {
            bu.textContent = '立即更新' + (info && info.size ? '（' + fmtSize(info.size) + '）' : '');
            bu.classList.remove('hidden');
        } else if (ph === 'downloading') {
            bu.textContent = '下载中…';
            bu.disabled = true;
            bl.disabled = true;
        } else if (ph === 'downloaded') {
            bu.textContent = '立即重启安装';
            bu.classList.remove('hidden');
            bl.disabled = true;
        } else if (ph === 'installing') {
            bu.textContent = '正在安装…';
            bu.disabled = true;
            bl.disabled = true;
        } else if (ph === 'error') {
            bu.textContent = '重试更新';
            bu.classList.remove('hidden');
            bl.disabled = force;
        }
        if (showProg) {
            $('prog-bar').style.width = (state.percent || 0) + '%';
            $('prog-pct').textContent = (state.percent || 0) + '%';
            $('prog-label').textContent = ph === 'downloaded' ? '下载完成' : (ph === 'installing' ? '正在安装并重启…' : '下载中…');
        }
    }

    function applyState(s) { state = s || state; render(); }
    function applyInfo(i) { info = i || info; render(); }

    if (bridge && bridge.updaterGetInfo) {
        bridge.updaterGetInfo().then(function (r) {
            if (r) { applyInfo(r.info); applyState(r.state); }
        });
        bridge.onUpdaterInfo && bridge.onUpdaterInfo(applyInfo);
        bridge.onUpdaterState && bridge.onUpdaterState(applyState);
        $('btn-update').addEventListener('click', function () {
            if (state.phase === 'downloaded' || state.phase === 'installing') { bridge.updaterInstall(); return; }
            bridge.updaterDownload();
        });
        $('btn-later').addEventListener('click', function () { bridge.updaterDismiss(); });
        $('tb-close').addEventListener('click', function () { bridge.updaterDismiss(); });
    } else {
        // 浏览器直开（非 Electron）：静态预览态
        $('ver-big').textContent = '发现新版本';
    }
    render();
})();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>下载手机版</title>
    <!-- 阶段二百八十二：手机版下载落地页（PC/WEB 悬停二维码指向本页）。
         链路归口：二维码内容 = location.origin + /download.html（app-download.js 生成）→
         本页拉取 /api/app/version?platform=android 取生效版本 → 组装 APK 直链供下载。
         独立中转页规避微信等内置浏览器对 APK 直链的拦截（直链被拦时引导用户跳系统浏览器）。
         国际化核心模块（置于最前同步加载语言包，share.html 同款；未归口文本自动回退中文） -->
    <script src="/js/i18n.js?v=3.33"></script>
    <!-- 主题首绘引导（仿 share.html：读 im_theme 立即挂 data-theme 并定死根背景，防主题闪烁；
         变量归口 css/style.css 的 :root 与 [data-theme] 块。扫码用户无本地主题偏好时默认深色，
         与主程序/分享页无偏好默认口径一致） -->
    <script>
        (function () {
            var t = '';
            try { t = localStorage.getItem('im_theme') || ''; } catch (e) { t = ''; }
            if (t !== 'light' && t !== 'dark' && t !== 'system') t = 'dark';
            var dark = t === 'dark' || (t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', t);
            document.documentElement.style.background = dark ? '#111111' : '#f5f5f5';
        })();
    </script>
    <!-- 变量源：复用主程序全局样式（主题变量/基础 reset，register.html 同款先例）；
         本页专属样式内联下方 <style>（im-dlp- 前缀，单文件自含，样式全部走主题变量跟随深浅） -->
    <link rel="stylesheet" href="/css/style.css?v=2.67">
    <style>
        html, body { height: 100%; }
        body {
            margin: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px calc(24px + env(safe-area-inset-bottom));
            box-sizing: border-box;
            font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif;
        }
        .im-dlp-card {
            width: 100%;
            max-width: 340px;
            background: var(--panel-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px 24px 24px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, .12);
        }
        .im-dlp-icon {
            width: 64px;
            height: 64px;
            border-radius: 14px;
            object-fit: contain;
            background: var(--hover);
        }
        .im-dlp-name {
            margin-top: 14px;
            font-size: 19px;
            font-weight: 600;
            color: var(--text);
        }
        .im-dlp-sub {
            margin-top: 4px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .im-dlp-meta {
            margin-top: 8px;
            font-size: 13px;
            color: var(--text-secondary);
            min-height: 18px;
        }
        .im-dlp-notes {
            margin-top: 12px;
            width: 100%;
            box-sizing: border-box;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text);
            background: var(--hover);
            border-radius: 8px;
            padding: 10px 12px;
            white-space: pre-wrap;
            word-break: break-word;
            text-align: left;
        }
        .im-dlp-btn {
            margin-top: 18px;
            width: 100%;
            box-sizing: border-box;
            height: 44px;
            line-height: 44px;
            border-radius: 10px;
            background: var(--primary);
            color: #fff;
            font-size: 15px;
            font-weight: 500;
            text-decoration: none;
            text-align: center;
        }
        .im-dlp-btn:active { opacity: .85; }
        .im-dlp-tip {
            margin-top: 14px;
            font-size: 12px;
            line-height: 1.6;
            color: var(--text-secondary);
        }
        .im-dlp-wxtip {
            margin-top: 10px;
            width: 100%;
            box-sizing: border-box;
            font-size: 12px;
            line-height: 1.6;
            color: #fa5151;
            background: var(--hover);
            border-radius: 8px;
            padding: 8px 10px;
        }
        .im-dlp-fail {
            margin-top: 14px;
            width: 100%;
            box-sizing: border-box;
            font-size: 13px;
            line-height: 1.6;
            color: var(--text-secondary);
            background: var(--hover);
            border-radius: 8px;
            padding: 12px;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="im-dlp-card">
        <img class="im-dlp-icon" src="/favicon.ico" alt="应用图标">
        <div class="im-dlp-name">即时通讯</div>
        <div class="im-dlp-sub">手机版安装包（Android）</div>
        <div class="im-dlp-meta" id="im-dlp-meta">正在获取版本信息…</div>
        <div class="im-dlp-notes hidden" id="im-dlp-notes"></div>
        <a class="im-dlp-btn hidden" id="im-dlp-btn" href="javascript:void(0)">下载安装包</a>
        <div class="im-dlp-wxtip hidden" id="im-dlp-wxtip">检测到微信内置浏览器：请点击右上角「···」选择「在浏览器打开」后下载</div>
        <div class="im-dlp-tip">安装时如提示"未知来源应用"，请允许后继续</div>
    </main>
    <script>
        (function () {
            'use strict';
            function T(s) {
                try { return (window.I18N && window.I18N.t) ? window.I18N.t(s) : s; } catch (e) { return s; }
            }
            function esc(s) {
                return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
                    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
                });
            }
            function fmtSize(n) {
                n = +n || 0;
                if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
                if (n >= 1024) return (n / 1024).toFixed(0) + ' KB';
                return n + ' B';
            }
            var metaEl = document.getElementById('im-dlp-meta');
            var notesEl = document.getElementById('im-dlp-notes');
            var btn = document.getElementById('im-dlp-btn');

            // 微信/QQ 等内置浏览器：APK 直链常被拦截，提前亮提示引导跳系统浏览器
            if (/MicroMessenger|MicroMsg|QQ\//i.test(navigator.userAgent)) {
                document.getElementById('im-dlp-wxtip').classList.remove('hidden');
            }

            // 版本信息：公开只读接口（免登录），生效版本存在时始终返回 version_name/url
            fetch('/api/app/version?platform=android&code=0&name=', { cache: 'no-store' })
                .then(function (r) { return r.json(); })
                .then(function (j) {
                    // 响应经 adminJSON 包装为 {ok, data:{...}}，data 兜底兼容平铺返回
                    var d = j && (j.data || j);
                    if (!d || !d.version_name || !d.url) {
                        metaEl.textContent = T('暂未提供手机版下载');
                        return;
                    }
                    metaEl.textContent = 'v' + esc(d.version_name) + (d.size ? ' · ' + fmtSize(d.size) : '');
                    if (d.notes) {
                        notesEl.textContent = d.notes;
                        notesEl.classList.remove('hidden');
                    }
                    // 相对路径拼当前站点origin（扫码打开本页的地址即服务器地址，天然匹配部署环境）；
                    // 外链模式本身为完整 http(s) 地址直接用；赋值前再校验协议（防 javascript: 注入）
                    var url = d.url;
                    if (url.charAt(0) === '/') url = location.origin + url;
                    if (!/^https?:\/\//i.test(url)) {
                        metaEl.textContent = T('暂未提供手机版下载');
                        return;
                    }
                    btn.href = url;
                    btn.classList.remove('hidden');
                })
                .catch(function () {
                    metaEl.textContent = '';
                    var fail = document.createElement('div');
                    fail.className = 'im-dlp-fail';
                    fail.textContent = T('获取版本信息失败，请稍后重试');
                    metaEl.parentNode.insertBefore(fail, metaEl.nextSibling);
                });
        })();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>截图编辑</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- 阶段一百四十：截图编辑器独立窗口承载页（独立 BrowserWindow，编辑器不再嵌在主窗体内）。
         编辑器画面全部由 ScreenshotEditor（js/screenshot.js）惰性构建，body 保持空壳；
         主题变量随 style.css 的 html[data-theme] 分支生效（editor-page.js 启动时按 localStorage 设置）；
         编辑任务由主进程经 editor:load 推送，完成/取消/长截图移交/录屏启动经 editor-page.js 桥接回传 -->
    <script src="js/screenshot.js"></script>
    <script src="js/editor-page.js"></script>
</body>
</html>
